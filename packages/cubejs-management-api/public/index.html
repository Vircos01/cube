<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAS | Voxel Analytics Service — Semantic Layer & Metrics Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- js-yaml for client-side YAML/JSON conversion -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for inline JSX -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>
  <!-- Monaco Editor loader -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .monaco-container { width: 100%; height: 100%; min-height: 480px; }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // API settings
      const [apiSecret, setApiSecret] = useState(localStorage.getItem('cube_mgmt_secret') || 'secret');
      const [schemaVersion, setSchemaVersion] = useState('loading...');
      const [models, setModels] = useState([]);
      const [selectedModel, setSelectedModel] = useState(null);
      const [activeTab, setActiveTab] = useState('editor'); // 'editor', 'revisions', 'introspect', 'query'
      
      // Editor state
      const [yamlContent, setYamlContent] = useState('');
      const [parsedForm, setParsedForm] = useState(null);
      const [validationResult, setValidationResult] = useState(null);
      const [saving, setSaving] = useState(false);
      const [notification, setNotification] = useState(null);
      
      // Data Source state
      const [dbTables, setDbTables] = useState([]);
      const [loadingIntrospect, setLoadingIntrospect] = useState(false);
      const [selectedTableNames, setSelectedTableNames] = useState([]);
      const [introspectSearch, setIntrospectSearch] = useState('');
      const [activeSourceMode, setActiveSourceMode] = useState('default'); // 'default' | 'custom'
      const [customConn, setCustomConn] = useState({
        host: 'postgres',
        port: 5432,
        database: 'cubedb',
        user: 'postgres',
        password: 'postgres',
        schema: 'public',
        ssl: false
      });
      const [customDsName, setCustomDsName] = useState('remote_dwh');
      const [connTestResult, setConnTestResult] = useState(null);
      const [testingConn, setTestingConn] = useState(false);
      const [autoJoins, setAutoJoins] = useState(true);
      const [autoMeasures, setAutoMeasures] = useState(true);
      const [generatingBatch, setGeneratingBatch] = useState(false);
      const [expandedTables, setExpandedTables] = useState({});

      // Query tester state
      const [queryJson, setQueryJson] = useState('{\n  "measures": ["Orders.count", "Orders.total_amount"],\n  "dimensions": ["Orders.status"]\n}');
      const [queryResult, setQueryResult] = useState(null);
      const [queryRunning, setQueryRunning] = useState(false);

      // Git state
      const [gitStatus, setGitStatus] = useState(null);
      const [gitDiff, setGitDiff] = useState('');
      const [gitLog, setGitLog] = useState([]);
      const [gitBranches, setGitBranches] = useState({ current: 'master', branches: ['master'] });
      const [commitMessage, setCommitMessage] = useState('');
      const [pushToRemote, setPushToRemote] = useState(false);
      const [gitLoading, setGitLoading] = useState(false);

      // Security / SSAS RBAC state
      const [securityData, setSecurityData] = useState(null);
      const [selectedSecurityUser, setSelectedSecurityUser] = useState('admin');
      const [securitySql, setSecuritySql] = useState('SELECT count, total_amount, avg_order_value FROM Orders');
      const [securitySqlResult, setSecuritySqlResult] = useState(null);
      const [securityRunning, setSecurityRunning] = useState(false);

      const monacoRef = useRef(null);
      const editorInstance = useRef(null);

      const getHeaders = () => ({
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiSecret}`
      });

      // Show notification toast
      const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      // Load health & schema version
      const fetchHealth = async () => {
        try {
          const res = await fetch('/management/v1/health');
          const data = await res.json();
          if (data.schemaVersion) setSchemaVersion(data.schemaVersion);
        } catch (e) {
          setSchemaVersion('Disconnected');
        }
      };

      // Load models from API
      const fetchModels = async () => {
        try {
          const res = await fetch('/management/v1/models', { headers: getHeaders() });
          if (res.status === 401) {
            notify('Invalid API Secret / Unauthorized', 'error');
            return;
          }
          const data = await res.json();
          setModels(data.models || []);
          if (data.models && data.models.length > 0 && !selectedModel) {
            selectModel(data.models[0].id);
          }
        } catch (e) {
          notify(`Failed to load models: ${e.message}`, 'error');
        }
      };

      // Select and load single model
      const selectModel = async (id) => {
        try {
          const res = await fetch(`/management/v1/models/${id}`, { headers: getHeaders() });
          const data = await res.json();
          if (data.model) {
            setSelectedModel(data.model);
            const content = data.model.active_revision ? data.model.active_revision.content : '';
            setYamlContent(content);
            syncFormFromYaml(content);
            if (editorInstance.current) {
              editorInstance.current.setValue(content);
            }
            validateYaml(content, data.model.file_name);
          }
        } catch (e) {
          notify(`Failed to fetch model: ${e.message}`, 'error');
        }
      };

      // Sync form state when YAML changes
      const syncFormFromYaml = (yamlText) => {
        try {
          const parsed = jsyaml.load(yamlText);
          if (parsed && (parsed.cubes || parsed.views)) {
            setParsedForm(parsed);
          }
        } catch {
          // Keep previous form state if YAML has syntax error
        }
      };

      // Sync YAML text when Form state is edited
      const syncYamlFromForm = (updatedForm) => {
        setParsedForm(updatedForm);
        try {
          const newYaml = jsyaml.dump(updatedForm, { indent: 2, lineWidth: -1 });
          setYamlContent(newYaml);
          if (editorInstance.current && editorInstance.current.getValue() !== newYaml) {
            editorInstance.current.setValue(newYaml);
          }
          validateYaml(newYaml, selectedModel ? selectedModel.file_name : 'model.cube.yml');
        } catch (e) {
          console.error(e);
        }
      };

      // Validate YAML in-memory via Management API
      const validateYaml = async (content, fileName) => {
        try {
          const res = await fetch('/management/v1/models/validate', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ content, fileName: fileName || 'model.cube.yml' })
          });
          const result = await res.json();
          setValidationResult(result);
        } catch (e) {
          setValidationResult({ valid: false, errors: [{ message: e.message }] });
        }
      };

      // Save Model and Hot-Reload
      const handleSave = async () => {
        if (!selectedModel) return;
        setSaving(true);
        try {
          const res = await fetch(`/management/v1/models/${selectedModel.id}`, {
            method: 'PUT',
            headers: getHeaders(),
            body: JSON.stringify({
              content: yamlContent,
              change_summary: `Updated via Web-UI at ${new Date().toLocaleTimeString()}`
            })
          });
          const data = await res.json();
          if (res.ok) {
            notify('✓ Model saved & VAS schema hot-reloaded successfully!');
            fetchHealth();
            fetchModels();
            selectModel(selectedModel.id);
          } else {
            notify(`Save failed: ${data.error || JSON.stringify(data.validation?.errors)}`, 'error');
          }
        } catch (e) {
          notify(`Network error: ${e.message}`, 'error');
        } finally {
          setSaving(false);
        }
      };

      // Rollback to specific revision
      const handleRollback = async (revNumber) => {
        if (!confirm(`Are you sure you want to rollback to revision #${revNumber}?`)) return;
        try {
          const res = await fetch(`/management/v1/models/${selectedModel.id}/rollback/${revNumber}`, {
            method: 'POST',
            headers: getHeaders(),
          });
          if (res.ok) {
            notify(`✓ Rolled back to revision #${revNumber} and reloaded schema!`);
            fetchHealth();
            selectModel(selectedModel.id);
          } else {
            const err = await res.json();
            notify(`Rollback error: ${err.error}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        }
      };

      // Test custom database connection
      const handleTestConnection = async () => {
        setTestingConn(true);
        setConnTestResult(null);
        try {
          const res = await fetch('/management/v1/datasources/test-connection', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(customConn)
          });
          const data = await res.json();
          setConnTestResult(data);
          if (data.success) {
            notify(`✓ Connection successful! (${data.latencyMs}ms)`);
            if (data.schemas && data.schemas.length > 0 && !data.schemas.includes(customConn.schema)) {
              setCustomConn(prev => ({ ...prev, schema: data.schemas[0] }));
            }
          } else {
            notify(`Connection failed: ${data.error}`, 'error');
          }
        } catch (e) {
          setConnTestResult({ success: false, error: e.message });
          notify(`Connection error: ${e.message}`, 'error');
        } finally {
          setTestingConn(false);
        }
      };

      // Introspect DB (Default or Custom DB)
      const loadIntrospect = async (mode = activeSourceMode) => {
        setLoadingIntrospect(true);
        try {
          const payload = mode === 'custom'
            ? { connection: customConn, schema: customConn.schema }
            : { schema: 'public' };

          const res = await fetch('/management/v1/datasources/introspect', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          const tables = data.tables || [];
          setDbTables(tables);
          setSelectedTableNames(tables.map(t => `${t.schema}.${t.name}`));
        } catch (e) {
          notify(`Introspection failed: ${e.message}`, 'error');
        } finally {
          setLoadingIntrospect(false);
        }
      };

      // Batch generate selected tables into VAS
      const handleBatchGenerate = async () => {
        const selected = dbTables.filter(t => selectedTableNames.includes(`${t.schema}.${t.name}`));
        if (selected.length === 0) {
          notify('Select at least one table to import', 'error');
          return;
        }

        setGeneratingBatch(true);
        try {
          const isCustom = activeSourceMode === 'custom';
          const payload = {
            tables: selected,
            options: { autoJoins, autoMeasures },
            connection: isCustom ? customConn : undefined,
            dataSourceName: isCustom ? (customDsName || 'remote_dwh') : undefined,
          };

          const res = await fetch('/management/v1/datasources/generate-cubes', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            const dsLabel = data.dataSource !== 'default' ? ` (Data source: ${data.dataSource})` : '';
            notify(`✓ Successfully generated & atomically imported ${data.count} models into VAS${dsLabel}!`);
            fetchHealth();
            await fetchModels();
            if (data.imported && data.imported.length > 0) {
              selectModel(data.imported[0].model.id);
            }
            setActiveTab('editor');
          } else {
            const validationDetails = data.validationErrors ? ': ' + data.validationErrors.map(e => e.message).join('; ') : '';
            notify(`Import failed: ${data.error}${validationDetails}`, 'error');
          }
        } catch (e) {
          notify(`Import error: ${e.message}`, 'error');
        } finally {
          setGeneratingBatch(false);
        }
      };

      // Generate single Cube from introspected table
      const generateCubeFromTable = async (table) => {
        setGeneratingBatch(true);
        try {
          const isCustom = activeSourceMode === 'custom';
          const payload = {
            tables: [table],
            options: { autoJoins, autoMeasures },
            connection: isCustom ? customConn : undefined,
            dataSourceName: isCustom ? (customDsName || 'remote_dwh') : undefined,
          };

          const res = await fetch('/management/v1/datasources/generate-cubes', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.imported && data.imported.length > 0) {
            const dsLabel = data.dataSource !== 'default' ? ` (Data source: ${data.dataSource})` : '';
            notify(`✓ Cube ${data.imported[0].cubeName} generated from table ${table.name}${dsLabel}!`);
            fetchHealth();
            await fetchModels();
            selectModel(data.imported[0].model.id);
            setActiveTab('editor');
          } else {
            const validationDetails = data.validationErrors ? ': ' + data.validationErrors.map(e => e.message).join('; ') : '';
            notify(`Failed: ${data.error}${validationDetails}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        } finally {
          setGeneratingBatch(false);
        }
      };

      // Run test query against Cube REST API
      const handleRunQuery = async () => {
        setQueryRunning(true);
        try {
          const parsed = JSON.parse(queryJson);
          const res = await fetch('/cubejs-api/v1/load', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': apiSecret
            },
            body: JSON.stringify({ query: parsed })
          });
          const data = await res.json();
          setQueryResult(data);
        } catch (e) {
          setQueryResult({ error: e.message });
        } finally {
          setQueryRunning(false);
        }
      };

      // Git Integration Functions
      const fetchGitStatus = async () => {
        try {
          const res = await fetch('/management/v1/git/status', { headers: getHeaders() });
          const data = await res.json();
          setGitStatus(data);
        } catch (e) {
          console.warn('Git status error:', e.message);
        }
      };

      const fetchGitDiff = async () => {
        try {
          const res = await fetch('/management/v1/git/diff', { headers: getHeaders() });
          const data = await res.json();
          setGitDiff(data.diff || '');
        } catch (e) {
          console.warn('Git diff error:', e.message);
        }
      };

      const fetchGitLog = async () => {
        try {
          const res = await fetch('/management/v1/git/log', { headers: getHeaders() });
          const data = await res.json();
          setGitLog(data.commits || []);
        } catch (e) {
          console.warn('Git log error:', e.message);
        }
      };

      const fetchGitBranches = async () => {
        try {
          const res = await fetch('/management/v1/git/branches', { headers: getHeaders() });
          const data = await res.json();
          if (data.branches) setGitBranches(data);
        } catch (e) {
          console.warn('Git branches error:', e.message);
        }
      };

      const handleGitCommit = async () => {
        if (!commitMessage.trim()) {
          notify('Please enter a commit message', 'error');
          return;
        }
        setGitLoading(true);
        try {
          const res = await fetch('/management/v1/git/commit', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ message: commitMessage, push: pushToRemote })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Committed to Git (${data.commitHash.slice(0, 7)}) ${data.pushed ? 'and pushed to remote!' : ''}`);
            setCommitMessage('');
            fetchGitStatus();
            fetchGitDiff();
            fetchGitLog();
          } else {
            notify(`Git commit failed: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        } finally {
          setGitLoading(false);
        }
      };

      const handleGitPull = async () => {
        setGitLoading(true);
        try {
          const res = await fetch('/management/v1/git/pull', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({})
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Pulled from Git! Synced ${data.importedCount || 0} models into PostgreSQL.`);
            fetchHealth();
            fetchModels();
            fetchGitStatus();
            fetchGitLog();
          } else {
            notify(`Git pull failed: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        } finally {
          setGitLoading(false);
        }
      };

      const handleGitCheckout = async (branch, createNew = false) => {
        setGitLoading(true);
        try {
          const res = await fetch('/management/v1/git/checkout', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ branch, createNew })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Switched to branch "${branch}" and synced models!`);
            fetchHealth();
            fetchModels();
            fetchGitStatus();
            fetchGitBranches();
          } else {
            notify(`Checkout failed: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        } finally {
          setGitLoading(false);
        }
      };

      // Security / SSAS RBAC API helpers
      const fetchSecurityRoles = async () => {
        try {
          const res = await fetch('/management/v1/security/roles', { headers: getHeaders() });
          const data = await res.json();
          setSecurityData(data);
        } catch (e) {
          console.error('Failed to load security roles:', e);
        }
      };

      const handleRunSecuritySql = async (overrideSql) => {
        const queryToRun = overrideSql || securitySql;
        if (!securityData || !securityData.roles) return;
        const roleObj = securityData.roles.find(r => r.username === selectedSecurityUser) || securityData.roles[0];

        setSecurityRunning(true);
        setSecuritySqlResult(null);
        try {
          const res = await fetch('/management/v1/security/test-sql', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
              username: roleObj.username,
              password: roleObj.password,
              sql: queryToRun
            })
          });
          const data = await res.json();
          setSecuritySqlResult(data);
        } catch (err) {
          setSecuritySqlResult({ success: false, error: err.message });
        } finally {
          setSecurityRunning(false);
        }
      };

      // Initialize Monaco Editor
      useEffect(() => {
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
          if (monacoRef.current && !editorInstance.current) {
            editorInstance.current = monaco.editor.create(monacoRef.current, {
              value: yamlContent || '# Select or create a model to view definition',
              language: 'yaml',
              theme: 'vs-dark',
              automaticLayout: true,
              minimap: { enabled: false },
              fontSize: 13,
              tabSize: 2,
              scrollBeyondLastLine: false,
            });

            editorInstance.current.onDidChangeModelContent(() => {
              const val = editorInstance.current.getValue();
              setYamlContent(val);
              syncFormFromYaml(val);
              validateYaml(val, selectedModel ? selectedModel.file_name : 'model.cube.yml');
            });
          }
        });
      }, []);

      // Initial data fetch
      useEffect(() => {
        fetchHealth();
        fetchModels();
        loadIntrospect();
        fetchGitStatus();
        fetchGitBranches();
        fetchGitLog();
        fetchGitDiff();
        fetchSecurityRoles();
      }, [apiSecret]);

      // Helper to update field in current form
      const updateCubeProp = (cubeIdx, key, val) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx][key] = val;
        syncYamlFromForm(copy);
      };

      const addDimension = (cubeIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        if (!copy.cubes[cubeIdx].dimensions) copy.cubes[cubeIdx].dimensions = [];
        copy.cubes[cubeIdx].dimensions.push({
          name: `new_dim_${Date.now() % 1000}`,
          sql: 'column_name',
          type: 'string'
        });
        syncYamlFromForm(copy);
      };

      const removeDimension = (cubeIdx, dimIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx].dimensions.splice(dimIdx, 1);
        syncYamlFromForm(copy);
      };

      const addMeasure = (cubeIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        if (!copy.cubes[cubeIdx].measures) copy.cubes[cubeIdx].measures = [];
        copy.cubes[cubeIdx].measures.push({
          name: `new_measure_${Date.now() % 1000}`,
          type: 'count'
        });
        syncYamlFromForm(copy);
      };

      const removeMeasure = (cubeIdx, mIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx].measures.splice(mIdx, 1);
        syncYamlFromForm(copy);
      };

      const addJoin = (cubeIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        if (!copy.cubes[cubeIdx].joins) copy.cubes[cubeIdx].joins = [];
        copy.cubes[cubeIdx].joins.push({
          name: 'TargetCube',
          sql: '{CUBE}.foreign_key = {TargetCube.id}',
          relationship: 'many_to_one'
        });
        syncYamlFromForm(copy);
      };

      const removeJoin = (cubeIdx, jIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx].joins.splice(jIdx, 1);
        syncYamlFromForm(copy);
      };

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden">
          {/* Top Navigation */}
          <header className="h-14 border-b border-slate-800 bg-slate-900 px-4 flex items-center justify-between shrink-0">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center font-black text-white text-[11px] shadow-md tracking-wider">
                VAS
              </div>
              <div className="flex items-center space-x-2">
                <span className="font-extrabold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-300">
                  VAS
                </span>
                <span className="text-xs px-2.5 py-0.5 rounded bg-indigo-950/80 text-indigo-300 border border-indigo-800/80 font-medium">
                  Voxel Analytics Service
                </span>
              </div>
            </div>

            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2 text-xs bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-slate-400">Schema Version:</span>
                <span className="font-mono text-emerald-300 font-semibold">{schemaVersion}</span>
              </div>

              {gitStatus && (
                <button 
                  onClick={() => { setActiveTab('git'); fetchGitStatus(); fetchGitDiff(); }}
                  className="flex items-center space-x-1.5 text-xs bg-slate-800/80 hover:bg-slate-700 px-2.5 py-1.5 rounded-full border border-slate-700 transition-colors"
                  title="Git Version Control"
                >
                  <span className="text-amber-400">🌿</span>
                  <span className="font-mono text-slate-200 font-semibold">{gitStatus.branch || 'master'}</span>
                  {!gitStatus.isClean ? (
                    <span className="text-[10px] bg-amber-950 text-amber-300 border border-amber-800 px-1 rounded-full font-mono">modified</span>
                  ) : (
                    <span className="text-[10px] text-emerald-400 font-mono">clean</span>
                  )}
                </button>
              )}

              <div className="flex items-center space-x-2 text-xs text-slate-400 bg-slate-800/50 px-2 py-1 rounded border border-slate-700/50">

                            onClick={handleTestConnection}
                            disabled={testingConn}
                            className="text-xs px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 font-medium"
                          >
                            {testingConn ? 'Verbinding testen...' : '🔌 Test Verbinding'}
                          </button>
                          <button
                            onClick={() => loadIntrospect('custom')}
                            disabled={loadingIntrospect}
                            className="text-xs px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-medium"
                          >
                            {loadingIntrospect ? 'Ophalen...' : 'Haal Tabellen Op'}
                          </button>
                        </div>
                      </div>

                      {/* Connection Fields Grid */}
                      <div className="grid grid-cols-4 gap-3 text-xs">
                        <div>
                          <label className="text-slate-400 block mb-1">Host / Server</label>
                          <input
                            type="text"
                            value={customConn.host}
                            onChange={(e) => setCustomConn({ ...customConn, host: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-indigo-500"
                            placeholder="e.g. postgres, localhost, db.company.com"
                          />
                        </div>
                        <div>
                          <label className="text-slate-400 block mb-1">Poort</label>
                          <input
                            type="number"
                            value={customConn.port}
                            onChange={(e) => setCustomConn({ ...customConn, port: parseInt(e.target.value, 10) || 5432 })}
                            className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-indigo-500"
                            placeholder="5432"
                          />
                        </div>
                        <div>
                          <label className="text-slate-400 block mb-1">Database Naam</label>
                          <input
                            type="text"
                            value={customConn.database}
                            onChange={(e) => setCustomConn({ ...customConn, database: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-indigo-500"
                            placeholder="cubedb, my_warehouse"
                          />
                        </div>
                        <div>
                          <label className="text-slate-400 block mb-1">Schema</label>
                          <input
                            type="text"
                            value={customConn.schema}
                            onChange={(e) => setCustomConn({ ...customConn, schema: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-indigo-500"
                            placeholder="public"
                          />
                        </div>

                        <div>
                          <label className="text-slate-400 block mb-1">Gebruikersnaam</label>
                          <input
                            type="text"
                            value={customConn.user}
                            onChange={(e) => setCustomConn({ ...customConn, user: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-indigo-500"
                            placeholder="postgres"
                          />
                        </div>
                        <div>
                          <label className="text-slate-400 block mb-1">Wachtwoord</label>
                          <input
                            type="password"
                            value={customConn.password}
                            onChange={(e) => setCustomConn({ ...customConn, password: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-indigo-500"
                            placeholder="••••••••"
                          />
                        </div>
                        <div>
                          <label className="text-slate-400 block mb-1">VAS Data Source ID (voor Cube)</label>
                          <input
                            type="text"
                            value={customDsName}
                            onChange={(e) => setCustomDsName(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-indigo-500"
                            placeholder="remote_dwh"
                          />
                        </div>
                        <div className="flex items-center space-x-2 pt-6">
                          <input
                            type="checkbox"
                            id="ssl-check"
                            checked={customConn.ssl}
                            onChange={(e) => setCustomConn({ ...customConn, ssl: e.target.checked })}
                            className="rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0"
                          />
                          <label htmlFor="ssl-check" className="text-slate-300 cursor-pointer">SSL inschakelen</label>
                        </div>
                      </div>

                      {/* Connection Test Banner if available */}
                      {connTestResult && (
                        <div className={`p-3 rounded-lg border text-xs flex items-center justify-between ${
                          connTestResult.success
                            ? 'bg-emerald-950/40 border-emerald-800 text-emerald-200'
                            : 'bg-rose-950/40 border-rose-800 text-rose-200'
                        }`}>
                          <div className="flex items-center space-x-2">
                            <span>{connTestResult.success ? '✓' : '✗'}</span>
                            <span>{connTestResult.success ? `Verbonden met ${connTestResult.version} (${connTestResult.latencyMs}ms)` : `Verbinding mislukt: ${connTestResult.error}`}</span>
                          </div>
                          {connTestResult.schemas && (
                            <div className="text-[11px] text-slate-400">
                              Beschikbare schema's: <span className="font-mono text-indigo-300">{connTestResult.schemas.join(', ')}</span>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}

                  {/* Data Source Toolbar (Search, Filter, Options & Batch Generate Button) */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                      {/* Search box */}
                      <div className="relative">
                        <input
                          type="text"
                          value={introspectSearch}
                          onChange={(e) => setIntrospectSearch(e.target.value)}
                          placeholder="Filter tabellen (bijv. orders, users)..."
                          className="w-64 bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                        />
                      </div>

                      {/* Select All toggle */}
                      <button
                        onClick={() => {
                          const allKeys = dbTables.map(t => `${t.schema}.${t.name}`);
                          if (selectedTableNames.length === dbTables.length) {
                            setSelectedTableNames([]);
                          } else {
                            setSelectedTableNames(allKeys);
                          }
                        }}
                        className="text-xs px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium"
                      >
                        {selectedTableNames.length === dbTables.length ? 'Deselecteer alles' : `Selecteer alles (${dbTables.length})`}
                      </button>

                      <div className="h-6 border-r border-slate-800"></div>

                      {/* Generation options checkboxes */}
                      <label className="flex items-center space-x-1.5 text-xs text-slate-300 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={autoJoins}
                          onChange={(e) => setAutoJoins(e.target.checked)}
                          className="rounded bg-slate-950 border-slate-700 text-indigo-600"
                        />
                        <span>Auto Joins (FK)</span>
                      </label>

                      <label className="flex items-center space-x-1.5 text-xs text-slate-300 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={autoMeasures}
                          onChange={(e) => setAutoMeasures(e.target.checked)}
                          className="rounded bg-slate-950 border-slate-700 text-indigo-600"
                        />
                        <span>Auto Measures (Sum/Avg)</span>
                      </label>
                    </div>

                    {/* Batch Generate CTA Button */}
                    <div className="flex items-center space-x-2">
                      <button
                        onClick={loadIntrospect}
                        disabled={loadingIntrospect}
                        className="text-xs px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium"
                      >
                        {loadingIntrospect ? 'Verversen...' : '🔄 Verversen'}
                      </button>

                      <button
                        onClick={handleBatchGenerate}
                        disabled={generatingBatch || selectedTableNames.length === 0}
                        className="text-xs px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow disabled:opacity-50 flex items-center space-x-1.5"
                      >
                        <span>🚀</span>
                        <span>
                          {generatingBatch ? 'Bezig met importeren...' : `Genereer & Neem ${selectedTableNames.length} Tabellen op in VAS`}
                        </span>
                      </button>
                    </div>
                  </div>

                  {/* Tables List / Cards */}
                  <div className="space-y-3">
                    {dbTables
                      .filter(t => !introspectSearch || t.name.toLowerCase().includes(introspectSearch.toLowerCase()))
                      .map(table => {
                        const tableKey = `${table.schema}.${table.name}`;
                        const isSelected = selectedTableNames.includes(tableKey);
                        const isExpanded = !!expandedTables[tableKey];
                        const cubeName = table.name.replace(/^(sample_|tbl_|dim_|fact_)/i, '')
                          .split(/[_-]+/).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
                        const alreadyExists = models.some(m => m.name.toLowerCase() === cubeName.toLowerCase());
                        const pkCols = table.columns.filter(c => c.isPrimaryKey).map(c => c.name);
                        const fks = table.foreignKeys || [];

                        return (
                          <div
                            key={tableKey}
                            className={`bg-slate-900 border rounded-xl overflow-hidden transition-all ${
                              isSelected ? 'border-indigo-600/70 bg-indigo-950/10' : 'border-slate-800'
                            }`}
                          >
                            {/* Card Header Row */}
                            <div className="p-4 flex items-center justify-between">
                              <div className="flex items-center space-x-3">
                                <input
                                  type="checkbox"
                                  checked={isSelected}
                                  onChange={(e) => {
                                    if (e.target.checked) {
                                      setSelectedTableNames([...selectedTableNames, tableKey]);
                                    } else {
                                      setSelectedTableNames(selectedTableNames.filter(k => k !== tableKey));
                                    }
                                  }}
                                  className="w-4 h-4 rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer"
                                />
                                <div>
                                  <div className="flex items-center space-x-2">
                                    <span className="font-mono font-bold text-slate-100 text-sm">{table.schema}.{table.name}</span>
                                    {alreadyExists ? (
                                      <span className="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded-full font-mono font-semibold">
                                        ✓ in VAS ({cubeName})
                                      </span>
                                    ) : (
                                      <span className="text-[10px] bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded-full font-mono font-semibold">
                                        + Nieuwe Tabel
                                      </span>
                                    )}
                                  </div>
                                  <div className="flex items-center space-x-2 text-[11px] text-slate-400 mt-1">
                                    <span>{table.columns.length} kolommen</span>
                                    {pkCols.length > 0 && (
                                      <>
                                        <span>•</span>
                                        <span className="text-amber-400 font-mono">🔑 PK: {pkCols.join(', ')}</span>
                                      </>
                                    )}
                                    {fks.length > 0 && (
                                      <>
                                        <span>•</span>
                                        <span className="text-indigo-400 font-mono">🔗 {fks.length} Foreign Key(s)</span>
                                      </>
                                    )}
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center space-x-2">
                                <button
                                  onClick={() => setExpandedTables({ ...expandedTables, [tableKey]: !isExpanded })}
                                  className="text-xs px-2.5 py-1 text-slate-400 hover:text-slate-200 bg-slate-950 rounded border border-slate-800"
                                >
                                  {isExpanded ? 'Verberg Kolommen ▲' : 'Bekijk Kolommen ▼'}
                                </button>
                                <button
                                  onClick={() => generateCubeFromTable(table)}
                                  className="text-xs px-3 py-1 bg-indigo-950 hover:bg-indigo-900 text-indigo-300 border border-indigo-700/60 rounded font-medium transition-colors"
                                >
                                  {alreadyExists ? 'Hergenereer Cube' : '+ Genereer Cube'}
                                </button>
                              </div>
                            </div>

                            {/* Expandable Columns & Foreign Keys Details */}
                            {isExpanded && (
                              <div className="border-t border-slate-800/80 bg-slate-950/70 p-4 space-y-3">
                                {fks.length > 0 && (
                                  <div>
                                    <span className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold block mb-1">
                                      Gedetecteerde Relaties (Foreign Keys):
                                    </span>
                                    <div className="space-y-1">
                                      {fks.map((fk, fkIdx) => (
                                        <div key={fkIdx} className="text-xs font-mono text-indigo-300 bg-indigo-950/40 border border-indigo-900/40 p-1.5 rounded flex items-center space-x-2">
                                          <span>🔗</span>
                                          <span><strong>{table.name}.{fk.column}</strong> ➔ <strong>{fk.foreignTable}.{fk.foreignColumn}</strong> (Many-to-One relatie)</span>
                                        </div>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                <div>
                                  <span className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold block mb-1">
                                    Kolommen & Datatypes:
                                  </span>
                                  <div className="grid grid-cols-3 gap-2">
                                    {table.columns.map(col => (
                                      <div key={col.name} className="bg-slate-900/90 border border-slate-800/80 p-2 rounded text-xs flex items-center justify-between font-mono">
                                        <div className="truncate">
                                          <span className="text-slate-200">{col.name}</span>
                                          {col.isPrimaryKey && <span className="text-amber-400 ml-1">🔑</span>}
                                        </div>
                                        <span className="text-slate-500 text-[10px]">{col.type}</span>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}

                    {dbTables.length === 0 && !loadingIntrospect && (
                      <div className="p-8 text-center text-slate-500 text-xs italic bg-slate-900 rounded-xl border border-slate-800">
                        Geen tabellen gevonden in het huidige schema. Klik op "Haal Tabellen Op" of controleer de verbindingsgegevens.
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
