<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Core — Semantic Layer Manager & Web-UI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- js-yaml for client-side YAML/JSON conversion -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for inline JSX -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>
  <!-- Monaco Editor loader -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .monaco-container { width: 100%; height: 100%; min-height: 480px; }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // API settings
      const [apiSecret, setApiSecret] = useState(localStorage.getItem('cube_mgmt_secret') || 'secret');
      const [schemaVersion, setSchemaVersion] = useState('loading...');
      const [models, setModels] = useState([]);
      const [selectedModel, setSelectedModel] = useState(null);
      const [activeTab, setActiveTab] = useState('editor'); // 'editor', 'revisions', 'introspect', 'query'
      
      // Editor state
      const [yamlContent, setYamlContent] = useState('');
      const [parsedForm, setParsedForm] = useState(null);
      const [validationResult, setValidationResult] = useState(null);
      const [saving, setSaving] = useState(false);
      const [notification, setNotification] = useState(null);
      
      // Introspect state
      const [dbTables, setDbTables] = useState([]);
      const [loadingIntrospect, setLoadingIntrospect] = useState(false);

      // Query tester state
      const [queryJson, setQueryJson] = useState('{\n  "measures": ["Orders.count", "Orders.total_amount"],\n  "dimensions": ["Orders.status"]\n}');
      const [queryResult, setQueryResult] = useState(null);
      const [queryRunning, setQueryRunning] = useState(false);

      const monacoRef = useRef(null);
      const editorInstance = useRef(null);

      const getHeaders = () => ({
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiSecret}`
      });

      // Show notification toast
      const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      // Load health & schema version
      const fetchHealth = async () => {
        try {
          const res = await fetch('/management/v1/health');
          const data = await res.json();
          if (data.schemaVersion) setSchemaVersion(data.schemaVersion);
        } catch (e) {
          setSchemaVersion('Disconnected');
        }
      };

      // Load models from API
      const fetchModels = async () => {
        try {
          const res = await fetch('/management/v1/models', { headers: getHeaders() });
          if (res.status === 401) {
            notify('Invalid API Secret / Unauthorized', 'error');
            return;
          }
          const data = await res.json();
          setModels(data.models || []);
          if (data.models && data.models.length > 0 && !selectedModel) {
            selectModel(data.models[0].id);
          }
        } catch (e) {
          notify(`Failed to load models: ${e.message}`, 'error');
        }
      };

      // Select and load single model
      const selectModel = async (id) => {
        try {
          const res = await fetch(`/management/v1/models/${id}`, { headers: getHeaders() });
          const data = await res.json();
          if (data.model) {
            setSelectedModel(data.model);
            const content = data.model.active_revision ? data.model.active_revision.content : '';
            setYamlContent(content);
            syncFormFromYaml(content);
            if (editorInstance.current) {
              editorInstance.current.setValue(content);
            }
            validateYaml(content, data.model.file_name);
          }
        } catch (e) {
          notify(`Failed to fetch model: ${e.message}`, 'error');
        }
      };

      // Sync form state when YAML changes
      const syncFormFromYaml = (yamlText) => {
        try {
          const parsed = jsyaml.load(yamlText);
          if (parsed && (parsed.cubes || parsed.views)) {
            setParsedForm(parsed);
          }
        } catch {
          // Keep previous form state if YAML has syntax error
        }
      };

      // Sync YAML text when Form state is edited
      const syncYamlFromForm = (updatedForm) => {
        setParsedForm(updatedForm);
        try {
          const newYaml = jsyaml.dump(updatedForm, { indent: 2, lineWidth: -1 });
          setYamlContent(newYaml);
          if (editorInstance.current && editorInstance.current.getValue() !== newYaml) {
            editorInstance.current.setValue(newYaml);
          }
          validateYaml(newYaml, selectedModel ? selectedModel.file_name : 'model.cube.yml');
        } catch (e) {
          console.error(e);
        }
      };

      // Validate YAML in-memory via Management API
      const validateYaml = async (content, fileName) => {
        try {
          const res = await fetch('/management/v1/models/validate', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ content, fileName: fileName || 'model.cube.yml' })
          });
          const result = await res.json();
          setValidationResult(result);
        } catch (e) {
          setValidationResult({ valid: false, errors: [{ message: e.message }] });
        }
      };

      // Save Model and Hot-Reload
      const handleSave = async () => {
        if (!selectedModel) return;
        setSaving(true);
        try {
          const res = await fetch(`/management/v1/models/${selectedModel.id}`, {
            method: 'PUT',
            headers: getHeaders(),
            body: JSON.stringify({
              content: yamlContent,
              change_summary: `Updated via Web-UI at ${new Date().toLocaleTimeString()}`
            })
          });
          const data = await res.json();
          if (res.ok) {
            notify('✓ Model saved & Cube Core schema hot-reloaded successfully!');
            fetchHealth();
            fetchModels();
            selectModel(selectedModel.id);
          } else {
            notify(`Save failed: ${data.error || JSON.stringify(data.validation?.errors)}`, 'error');
          }
        } catch (e) {
          notify(`Network error: ${e.message}`, 'error');
        } finally {
          setSaving(false);
        }
      };

      // Rollback to specific revision
      const handleRollback = async (revNumber) => {
        if (!confirm(`Are you sure you want to rollback to revision #${revNumber}?`)) return;
        try {
          const res = await fetch(`/management/v1/models/${selectedModel.id}/rollback/${revNumber}`, {
            method: 'POST',
            headers: getHeaders(),
          });
          if (res.ok) {
            notify(`✓ Rolled back to revision #${revNumber} and reloaded schema!`);
            fetchHealth();
            selectModel(selectedModel.id);
          } else {
            const err = await res.json();
            notify(`Rollback error: ${err.error}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        }
      };

      // Introspect DB
      const loadIntrospect = async () => {
        setLoadingIntrospect(true);
        try {
          const res = await fetch('/management/v1/datasources/introspect', { headers: getHeaders() });
          const data = await res.json();
          setDbTables(data.tables || []);
        } catch (e) {
          notify(`Introspection failed: ${e.message}`, 'error');
        } finally {
          setLoadingIntrospect(false);
        }
      };

      // Generate Cube from introspected table
      const generateCubeFromTable = async (table) => {
        const cubeName = table.name.replace(/^(sample_|tbl_)/, '')
          .split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');

        const dims = table.columns.map(c => {
          let type = 'string';
          if (c.type.includes('int') || c.type.includes('num') || c.type.includes('float') || c.type.includes('double')) type = 'number';
          else if (c.type.includes('time') || c.type.includes('date')) type = 'time';
          else if (c.type.includes('bool')) type = 'boolean';

          return {
            name: c.name,
            sql: c.name,
            type,
            ...(c.isPrimaryKey ? { primary_key: true } : {})
          };
        });

        const newCubeDef = {
          cubes: [
            {
              name: cubeName,
              sql_table: `${table.schema}.${table.name}`,
              dimensions: dims,
              measures: [
                { name: 'count', type: 'count' }
              ]
            }
          ]
        };

        const newYaml = jsyaml.dump(newCubeDef, { indent: 2, lineWidth: -1 });

        try {
          const res = await fetch('/management/v1/models', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
              name: cubeName,
              model_type: 'cube',
              content: newYaml,
              change_summary: `Auto-generated from database table ${table.name}`
            })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Cube ${cubeName} generated from table ${table.name}!`);
            fetchHealth();
            await fetchModels();
            selectModel(data.model.id);
            setActiveTab('editor');
          } else {
            notify(`Failed: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        }
      };

      // Run test query against Cube REST API
      const handleRunQuery = async () => {
        setQueryRunning(true);
        try {
          const parsed = JSON.parse(queryJson);
          const res = await fetch('/cubejs-api/v1/load', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': apiSecret
            },
            body: JSON.stringify({ query: parsed })
          });
          const data = await res.json();
          setQueryResult(data);
        } catch (e) {
          setQueryResult({ error: e.message });
        } finally {
          setQueryRunning(false);
        }
      };

      // Initialize Monaco Editor
      useEffect(() => {
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
          if (monacoRef.current && !editorInstance.current) {
            editorInstance.current = monaco.editor.create(monacoRef.current, {
              value: yamlContent || '# Select or create a model to view definition',
              language: 'yaml',
              theme: 'vs-dark',
              automaticLayout: true,
              minimap: { enabled: false },
              fontSize: 13,
              tabSize: 2,
              scrollBeyondLastLine: false,
            });

            editorInstance.current.onDidChangeModelContent(() => {
              const val = editorInstance.current.getValue();
              setYamlContent(val);
              syncFormFromYaml(val);
              validateYaml(val, selectedModel ? selectedModel.file_name : 'model.cube.yml');
            });
          }
        });
      }, []);

      // Initial data fetch
      useEffect(() => {
        fetchHealth();
        fetchModels();
        loadIntrospect();
      }, [apiSecret]);

      // Helper to update field in current form
      const updateCubeProp = (cubeIdx, key, val) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx][key] = val;
        syncYamlFromForm(copy);
      };

      const addDimension = (cubeIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        if (!copy.cubes[cubeIdx].dimensions) copy.cubes[cubeIdx].dimensions = [];
        copy.cubes[cubeIdx].dimensions.push({
          name: `new_dim_${Date.now() % 1000}`,
          sql: 'column_name',
          type: 'string'
        });
        syncYamlFromForm(copy);
      };

      const removeDimension = (cubeIdx, dimIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx].dimensions.splice(dimIdx, 1);
        syncYamlFromForm(copy);
      };

      const addMeasure = (cubeIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        if (!copy.cubes[cubeIdx].measures) copy.cubes[cubeIdx].measures = [];
        copy.cubes[cubeIdx].measures.push({
          name: `new_measure_${Date.now() % 1000}`,
          type: 'count'
        });
        syncYamlFromForm(copy);
      };

      const removeMeasure = (cubeIdx, mIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx].measures.splice(mIdx, 1);
        syncYamlFromForm(copy);
      };

      const addJoin = (cubeIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        if (!copy.cubes[cubeIdx].joins) copy.cubes[cubeIdx].joins = [];
        copy.cubes[cubeIdx].joins.push({
          name: 'TargetCube',
          sql: '{CUBE}.foreign_key = {TargetCube.id}',
          relationship: 'many_to_one'
        });
        syncYamlFromForm(copy);
      };

      const removeJoin = (cubeIdx, jIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx].joins.splice(jIdx, 1);
        syncYamlFromForm(copy);
      };

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden">
          {/* Top Navigation */}
          <header className="h-14 border-b border-slate-800 bg-slate-900 px-4 flex items-center justify-between shrink-0">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow">
                C
              </div>
              <span className="font-bold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-300">
                Cube Core
              </span>
              <span className="text-xs px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800 font-mono font-medium">
                Semantic Layer Manager
              </span>
            </div>

            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2 text-xs bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-slate-400">Schema Version:</span>
                <span className="font-mono text-emerald-300 font-semibold">{schemaVersion}</span>
              </div>

              <div className="flex items-center space-x-2 text-xs text-slate-400 bg-slate-800/50 px-2 py-1 rounded border border-slate-700/50">
                <span>SQL-API:</span>
                <span className="font-mono text-indigo-300 font-bold">15432</span>
              </div>

              <div className="flex items-center space-x-2">
                <input 
                  type="password"
                  placeholder="API Secret"
                  value={apiSecret}
                  onChange={(e) => {
                    setApiSecret(e.target.value);
                    localStorage.setItem('cube_mgmt_secret', e.target.value);
                  }}
                  className="bg-slate-950 border border-slate-700 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 w-28"
                  title="CUBEJS_API_SECRET for Management API auth"
                />
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className={`fixed bottom-4 right-4 z-50 px-4 py-2.5 rounded-lg shadow-xl text-sm font-medium flex items-center space-x-2 border ${
              notification.type === 'error' ? 'bg-rose-950 border-rose-700 text-rose-200' : 'bg-emerald-950 border-emerald-700 text-emerald-200'
            }`}>
              <span>{notification.msg}</span>
            </div>
          )}

          {/* Main Layout Area */}
          <div className="flex flex-1 overflow-hidden">
            {/* Sidebar: Schema Explorer */}
            <aside className="w-72 border-r border-slate-800 bg-slate-900/60 flex flex-col shrink-0">
              <div className="p-3 border-b border-slate-800 flex items-center justify-between">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Semantic Explorer</span>
                <button
                  onClick={() => {
                    const name = prompt('Enter new Cube name (e.g. Products):');
                    if (!name) return;
                    const initialYaml = `cubes:\n  - name: ${name}\n    sql_table: public.${name.toLowerCase()}\n    dimensions:\n      - name: id\n        sql: id\n        type: number\n        primary_key: true\n    measures:\n      - name: count\n        type: count\n`;
                    fetch('/management/v1/models', {
                      method: 'POST',
                      headers: getHeaders(),
                      body: JSON.stringify({ name, content: initialYaml })
                    }).then(r => r.json()).then(d => {
                      if (d.model) {
                        notify(`Created ${name}`);
                        fetchModels();
                        selectModel(d.model.id);
                      }
                    });
                  }}
                  className="text-xs px-2 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded font-medium flex items-center space-x-1"
                >
                  <span>+ New</span>
                </button>
              </div>

              {/* Models List */}
              <div className="flex-1 overflow-y-auto p-2 space-y-1">
                <div className="text-[11px] font-semibold text-slate-500 uppercase px-2 pt-1 pb-1">Cubes & Views</div>
                {models.map(m => (
                  <button
                    key={m.id}
                    onClick={() => selectModel(m.id)}
                    className={`w-full text-left px-2.5 py-2 rounded-md text-sm flex items-center justify-between transition-colors ${
                      selectedModel && selectedModel.id === m.id
                        ? 'bg-indigo-900/40 text-indigo-200 border border-indigo-700/50'
                        : 'text-slate-300 hover:bg-slate-800/60'
                    }`}
                  >
                    <div className="flex items-center space-x-2 truncate">
                      <span className={`w-2 h-2 rounded-full ${m.model_type === 'view' ? 'bg-purple-400' : 'bg-indigo-400'}`}></span>
                      <span className="font-medium truncate">{m.name}</span>
                    </div>
                    <span className="text-[10px] text-slate-500 font-mono">
                      r{m.active_revision ? m.active_revision.revision_number : 1}
                    </span>
                  </button>
                ))}

                {models.length === 0 && (
                  <div className="text-xs text-slate-500 p-3 italic text-center">
                    No models in PostgreSQL. Click "+ New" or generate from introspected tables.
                  </div>
                )}

                {/* Data Source Tables */}
                <div className="pt-4 text-[11px] font-semibold text-slate-500 uppercase px-2 pb-1 flex items-center justify-between">
                  <span>Source Tables</span>
                  <button onClick={loadIntrospect} className="text-indigo-400 hover:underline">
                    {loadingIntrospect ? '...' : 'Refresh'}
                  </button>
                </div>
                {dbTables.map(t => (
                  <div key={`${t.schema}.${t.name}`} className="group px-2.5 py-1.5 rounded text-xs flex items-center justify-between text-slate-400 hover:bg-slate-800/40">
                    <span className="truncate font-mono">{t.name}</span>
                    <button
                      onClick={() => generateCubeFromTable(t)}
                      className="opacity-0 group-hover:opacity-100 text-[10px] px-1.5 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800 hover:bg-indigo-800"
                      title="Generate Cube from table"
                    >
                      + Cube
                    </button>
                  </div>
                ))}
              </div>
            </aside>

            {/* Content Area */}
            <main className="flex-1 flex flex-col overflow-hidden bg-slate-950">
              {/* Tab Navigation & Action Bar */}
              <div className="h-11 border-b border-slate-800 bg-slate-900/40 px-4 flex items-center justify-between shrink-0">
                <div className="flex space-x-1">
                  {[
                    { id: 'editor', label: 'Visual & YAML Split-View' },
                    { id: 'revisions', label: 'Version History & Rollback' },
                    { id: 'query', label: 'Query & SQL Tester' },
                    { id: 'introspect', label: 'Database Introspection' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`px-3 py-1.5 rounded-t text-xs font-medium transition-colors ${
                        activeTab === tab.id
                          ? 'bg-slate-800 text-indigo-300 border-b-2 border-indigo-500'
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {activeTab === 'editor' && (
                  <div className="flex items-center space-x-3">
                    {/* Validation Pill */}
                    {validationResult && (
                      <div className={`text-xs px-2.5 py-1 rounded-full flex items-center space-x-1.5 font-medium ${
                        validationResult.valid
                          ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800/80'
                          : 'bg-rose-950/80 text-rose-300 border border-rose-800/80'
                      }`}>
                        <span className={`w-1.5 h-1.5 rounded-full ${validationResult.valid ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                        <span>{validationResult.valid ? '✓ Valid Schema' : `${validationResult.errors?.length || 1} Error(s)`}</span>
                      </div>
                    )}

                    <button
                      onClick={() => validateYaml(yamlContent, selectedModel ? selectedModel.file_name : 'model.cube.yml')}
                      className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium"
                    >
                      Validate
                    </button>

                    <button
                      onClick={handleSave}
                      disabled={saving || (validationResult && !validationResult.valid)}
                      className={`text-xs px-3.5 py-1 rounded font-semibold text-white shadow flex items-center space-x-1.5 ${
                        saving || (validationResult && !validationResult.valid)
                          ? 'bg-slate-700 cursor-not-allowed opacity-60'
                          : 'bg-indigo-600 hover:bg-indigo-500'
                      }`}
                    >
                      <span>{saving ? 'Hot-Reloading...' : 'Save & Hot-Reload'}</span>
                    </button>
                  </div>
                )}
              </div>

              {/* TAB 1: VISUAL & YAML SPLIT-VIEW */}
              {activeTab === 'editor' && (
                <div className="flex-1 flex overflow-hidden">
                  {/* Left Half: Visual Form Builder */}
                  <div className="w-1/2 border-r border-slate-800 overflow-y-auto p-4 space-y-6">
                    {parsedForm && parsedForm.cubes && parsedForm.cubes.map((cube, cIdx) => (
                      <div key={cube.name || cIdx} className="space-y-5 bg-slate-900/50 p-4 rounded-xl border border-slate-800/80">
                        {/* Cube Header */}
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-sm font-bold text-slate-200 flex items-center space-x-2">
                              <span className="w-2.5 h-2.5 rounded bg-indigo-500"></span>
                              <span>Cube: {cube.name}</span>
                            </span>
                            <span className="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">
                              sql_table: {cube.sql_table || 'custom'}
                            </span>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-[11px] font-medium text-slate-400">Cube Name</label>
                              <input
                                type="text"
                                value={cube.name || ''}
                                onChange={(e) => updateCubeProp(cIdx, 'name', e.target.value)}
                                className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 mt-1 focus:border-indigo-500 focus:outline-none"
                              />
                            </div>
                            <div>
                              <label className="text-[11px] font-medium text-slate-400">SQL Table</label>
                              <input
                                type="text"
                                value={cube.sql_table || ''}
                                onChange={(e) => updateCubeProp(cIdx, 'sql_table', e.target.value)}
                                className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 mt-1 focus:border-indigo-500 focus:outline-none font-mono"
                              />
                            </div>
                          </div>
                        </div>

                        {/* Dimensions Builder */}
                        <div className="border-t border-slate-800 pt-4">
                          <div className="flex items-center justify-between mb-2">
                            <span className="text-xs font-semibold uppercase tracking-wider text-indigo-300">Dimensions</span>
                            <button
                              onClick={() => addDimension(cIdx)}
                              className="text-[11px] text-indigo-400 hover:text-indigo-300 font-medium"
                            >
                              + Add Dimension
                            </button>
                          </div>
                          <div className="space-y-2">
                            {(cube.dimensions || []).map((dim, dIdx) => (
                              <div key={dIdx} className="flex items-center space-x-2 bg-slate-950/70 p-2 rounded border border-slate-800">
                                <input
                                  type="text"
                                  placeholder="Name"
                                  value={dim.name}
                                  onChange={(e) => {
                                    const copy = JSON.parse(JSON.stringify(parsedForm));
                                    copy.cubes[cIdx].dimensions[dIdx].name = e.target.value;
                                    syncYamlFromForm(copy);
                                  }}
                                  className="w-1/3 bg-slate-900 border border-slate-700/60 rounded px-2 py-1 text-xs text-slate-200"
                                />
                                <input
                                  type="text"
                                  placeholder="SQL Column"
                                  value={dim.sql || ''}
                                  onChange={(e) => {
                                    const copy = JSON.parse(JSON.stringify(parsedForm));
                                    copy.cubes[cIdx].dimensions[dIdx].sql = e.target.value;
                                    syncYamlFromForm(copy);
                                  }}
                                  className="w-1/3 bg-slate-900 border border-slate-700/60 rounded px-2 py-1 text-xs text-slate-200 font-mono"
                                />
                                <select
                                  value={dim.type || 'string'}
                                  onChange={(e) => {
                                    const copy = JSON.parse(JSON.stringify(parsedForm));
                                    copy.cubes[cIdx].dimensions[dIdx].type = e.target.value;
                                    syncYamlFromForm(copy);
                                  }}
                                  className="w-24 bg-slate-900 border border-slate-700/60 rounded px-2 py-1 text-xs text-slate-200"
                                >
                                  <option value="string">string</option>
                                  <option value="number">number</option>
                                  <option value="time">time</option>
                                  <option value="boolean">boolean</option>
                                  <option value="geo">geo</option>
                                </select>
                                <label className="flex items-center space-x-1 text-[11px] text-slate-400">
                                  <input
                                    type="checkbox"
                                    checked={!!dim.primary_key}
                                    onChange={(e) => {
                                      const copy = JSON.parse(JSON.stringify(parsedForm));
                                      copy.cubes[cIdx].dimensions[dIdx].primary_key = e.target.checked;
                                      syncYamlFromForm(copy);
                                    }}
                                  />
                                  <span>PK</span>
                                </label>
                                <button
                                  onClick={() => removeDimension(cIdx, dIdx)}
                                  className="text-slate-500 hover:text-rose-400 text-xs px-1"
                                >
                                  ✕
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Measures Builder */}
                        <div className="border-t border-slate-800 pt-4">
                          <div className="flex items-center justify-between mb-2">
                            <span className="text-xs font-semibold uppercase tracking-wider text-purple-300">Measures</span>
                            <button
                              onClick={() => addMeasure(cIdx)}
                              className="text-[11px] text-purple-400 hover:text-purple-300 font-medium"
                            >
                              + Add Measure
                            </button>
                          </div>
                          <div className="space-y-2">
                            {(cube.measures || []).map((m, mIdx) => (
                              <div key={mIdx} className="flex items-center space-x-2 bg-slate-950/70 p-2 rounded border border-slate-800">
                                <input
                                  type="text"
                                  placeholder="Name"
                                  value={m.name}
                                  onChange={(e) => {
                                    const copy = JSON.parse(JSON.stringify(parsedForm));
                                    copy.cubes[cIdx].measures[mIdx].name = e.target.value;
                                    syncYamlFromForm(copy);
                                  }}
                                  className="w-1/3 bg-slate-900 border border-slate-700/60 rounded px-2 py-1 text-xs text-slate-200"
                                />
                                <input
                                  type="text"
                                  placeholder="SQL Column / Expression"
                                  value={m.sql || ''}
                                  onChange={(e) => {
                                    const copy = JSON.parse(JSON.stringify(parsedForm));
                                    copy.cubes[cIdx].measures[mIdx].sql = e.target.value;
                                    syncYamlFromForm(copy);
                                  }}
                                  className="w-1/3 bg-slate-900 border border-slate-700/60 rounded px-2 py-1 text-xs text-slate-200 font-mono"
                                />
                                <select
                                  value={m.type || 'count'}
                                  onChange={(e) => {
                                    const copy = JSON.parse(JSON.stringify(parsedForm));
                                    copy.cubes[cIdx].measures[mIdx].type = e.target.value;
                                    syncYamlFromForm(copy);
                                  }}
                                  className="w-28 bg-slate-900 border border-slate-700/60 rounded px-2 py-1 text-xs text-slate-200"
                                >
                                  <option value="count">count</option>
                                  <option value="count_distinct">count_distinct</option>
                                  <option value="sum">sum</option>
                                  <option value="avg">avg</option>
                                  <option value="min">min</option>
                                  <option value="max">max</option>
                                </select>
                                <button
                                  onClick={() => removeMeasure(cIdx, mIdx)}
                                  className="text-slate-500 hover:text-rose-400 text-xs px-1"
                                >
                                  ✕
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Joins Builder */}
                        <div className="border-t border-slate-800 pt-4">
                          <div className="flex items-center justify-between mb-2">
                            <span className="text-xs font-semibold uppercase tracking-wider text-emerald-300">Joins</span>
                            <button
                              onClick={() => addJoin(cIdx)}
                              className="text-[11px] text-emerald-400 hover:text-emerald-300 font-medium"
                            >
                              + Add Join
                            </button>
                          </div>
                          <div className="space-y-2">
                            {(cube.joins || []).map((j, jIdx) => (
                              <div key={jIdx} className="flex items-center space-x-2 bg-slate-950/70 p-2 rounded border border-slate-800">
                                <input
                                  type="text"
                                  placeholder="Target Cube"
                                  value={j.name}
                                  onChange={(e) => {
                                    const copy = JSON.parse(JSON.stringify(parsedForm));
                                    copy.cubes[cIdx].joins[jIdx].name = e.target.value;
                                    syncYamlFromForm(copy);
                                  }}
                                  className="w-1/4 bg-slate-900 border border-slate-700/60 rounded px-2 py-1 text-xs text-slate-200"
                                />
                                <input
                                  type="text"
                                  placeholder="Join SQL: {CUBE}.col = {Target.col}"
                                  value={j.sql || ''}
                                  onChange={(e) => {
                                    const copy = JSON.parse(JSON.stringify(parsedForm));
                                    copy.cubes[cIdx].joins[jIdx].sql = e.target.value;
                                    syncYamlFromForm(copy);
                                  }}
                                  className="w-1/2 bg-slate-900 border border-slate-700/60 rounded px-2 py-1 text-xs text-slate-200 font-mono"
                                />
                                <select
                                  value={j.relationship || 'many_to_one'}
                                  onChange={(e) => {
                                    const copy = JSON.parse(JSON.stringify(parsedForm));
                                    copy.cubes[cIdx].joins[jIdx].relationship = e.target.value;
                                    syncYamlFromForm(copy);
                                  }}
                                  className="w-28 bg-slate-900 border border-slate-700/60 rounded px-2 py-1 text-xs text-slate-200"
                                >
                                  <option value="many_to_one">many_to_one</option>
                                  <option value="one_to_many">one_to_many</option>
                                  <option value="one_to_one">one_to_one</option>
                                </select>
                                <button
                                  onClick={() => removeJoin(cIdx, jIdx)}
                                  className="text-slate-500 hover:text-rose-400 text-xs px-1"
                                >
                                  ✕
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    ))}

                    {!parsedForm && (
                      <div className="text-slate-500 text-sm italic p-4 text-center">
                        Select a cube from the left sidebar or create one to begin visual editing.
                      </div>
                    )}
                  </div>

                  {/* Right Half: Monaco YAML Editor */}
                  <div className="w-1/2 flex flex-col h-full bg-[#1e1e1e]">
                    <div className="flex-1 monaco-container" ref={monacoRef}></div>

                    {/* Inline Error Bar if invalid */}
                    {validationResult && !validationResult.valid && (
                      <div className="bg-rose-950 border-t border-rose-800 p-3 max-h-36 overflow-y-auto shrink-0 text-xs text-rose-200">
                        <div className="font-bold flex items-center space-x-1 mb-1">
                          <span>Compiler / Validation Errors:</span>
                        </div>
                        {validationResult.errors?.map((err, i) => (
                          <div key={i} className="font-mono text-[11px] py-0.5">
                            {err.line && <span className="text-rose-400 font-bold mr-1">Line {err.line}:</span>}
                            <span>{err.message}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* TAB 2: REVISIONS & DIFF HISTORY */}
              {activeTab === 'revisions' && (
                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  <h2 className="text-base font-bold text-slate-200">
                    Revision History for {selectedModel ? selectedModel.name : 'Model'}
                  </h2>
                  <div className="space-y-3">
                    {selectedModel && selectedModel.revisions && selectedModel.revisions.map(rev => (
                      <div key={rev.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                        <div className="space-y-1">
                          <div className="flex items-center space-x-2">
                            <span className="font-mono font-bold text-indigo-400">Revision #{rev.revision_number}</span>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${
                              rev.status === 'active' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-slate-800 text-slate-400'
                            }`}>
                              {rev.status}
                            </span>
                          </div>
                          <p className="text-xs text-slate-300">{rev.change_summary || 'No description'}</p>
                          <div className="text-[11px] text-slate-500">
                            Created at {new Date(rev.created_at).toLocaleString()} by <span className="font-mono text-slate-400">{rev.created_by}</span>
                          </div>
                        </div>

                        <div className="flex items-center space-x-2">
                          <button
                            onClick={() => {
                              setYamlContent(rev.content);
                              syncFormFromYaml(rev.content);
                              if (editorInstance.current) editorInstance.current.setValue(rev.content);
                              setActiveTab('editor');
                              notify(`Loaded revision #${rev.revision_number} into editor`);
                            }}
                            className="text-xs px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200"
                          >
                            Preview in Editor
                          </button>
                          {rev.status !== 'active' && (
                            <button
                              onClick={() => handleRollback(rev.revision_number)}
                              className="text-xs px-3 py-1.5 rounded bg-amber-600 hover:bg-amber-500 text-white font-medium shadow"
                            >
                              Rollback to This
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: QUERY & SQL TESTER */}
              {activeTab === 'query' && (
                <div className="flex-1 flex overflow-hidden">
                  <div className="w-1/2 p-4 border-r border-slate-800 flex flex-col space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-semibold uppercase text-slate-400">Query JSON (Cube REST / Superset)</span>
                      <button
                        onClick={handleRunQuery}
                        disabled={queryRunning}
                        className="text-xs px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded font-medium shadow"
                      >
                        {queryRunning ? 'Running...' : 'Execute Query'}
                      </button>
                    </div>
                    <textarea
                      value={queryJson}
                      onChange={(e) => setQueryJson(e.target.value)}
                      className="flex-1 w-full bg-slate-950 border border-slate-800 rounded p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div className="w-1/2 p-4 flex flex-col overflow-hidden">
                    <span className="text-xs font-semibold uppercase text-slate-400 mb-3">Query Results</span>
                    <div className="flex-1 overflow-auto bg-slate-900 border border-slate-800 rounded p-3">
                      {queryResult ? (
                        queryResult.data && queryResult.data.length > 0 ? (
                          <table className="w-full text-left text-xs text-slate-300">
                            <thead>
                              <tr className="border-b border-slate-800 text-slate-400 font-mono">
                                {Object.keys(queryResult.data[0]).map(k => (
                                  <th key={k} className="p-2">{k}</th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {queryResult.data.map((row, i) => (
                                <tr key={i} className="border-b border-slate-800/40 hover:bg-slate-800/40 font-mono">
                                  {Object.values(row).map((v, j) => (
                                    <td key={j} className="p-2">{String(v)}</td>
                                  ))}
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        ) : (
                          <pre className="text-xs font-mono text-slate-400 whitespace-pre-wrap">
                            {JSON.stringify(queryResult, null, 2)}
                          </pre>
                        )
                      ) : (
                        <div className="text-xs text-slate-500 italic p-4 text-center">
                          Click "Execute Query" to test live analytics from Cube Core.
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 4: DATABASE INTROSPECTION */}
              {activeTab === 'introspect' && (
                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-base font-bold text-slate-200">Database Introspection</h2>
                      <p className="text-xs text-slate-400">Inspect physical database tables and automatically generate Cubes</p>
                    </div>
                    <button
                      onClick={loadIntrospect}
                      className="text-xs px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-medium"
                    >
                      {loadingIntrospect ? 'Introspecting...' : 'Re-introspect Database'}
                    </button>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    {dbTables.map(table => (
                      <div key={`${table.schema}.${table.name}`} className="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="font-mono font-bold text-slate-200 text-sm">{table.schema}.{table.name}</span>
                          <button
                            onClick={() => generateCubeFromTable(table)}
                            className="text-xs px-2.5 py-1 bg-indigo-950 hover:bg-indigo-800 text-indigo-300 border border-indigo-700 rounded font-medium"
                          >
                            + Generate Cube
                          </button>
                        </div>

                        <div className="border-t border-slate-800 pt-2 space-y-1">
                          {table.columns.map(col => (
                            <div key={col.name} className="flex items-center justify-between text-xs py-0.5 font-mono text-slate-400">
                              <span>{col.name}</span>
                              <span className="text-[11px] text-slate-500">
                                {col.type} {col.isPrimaryKey ? '🔑 PK' : ''}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
