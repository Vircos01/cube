<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAS | Voxel Analytics Service — Semantic Layer & Metrics Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- js-yaml for client-side YAML/JSON conversion -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for inline JSX -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>
  <!-- Monaco Editor loader -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .monaco-container { width: 100%; height: 100%; min-height: 480px; }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // API settings
      const [apiSecret, setApiSecret] = useState(localStorage.getItem('cube_mgmt_secret') || 'secret');
      const [schemaVersion, setSchemaVersion] = useState('loading...');
      const [models, setModels] = useState([]);
      const [selectedModel, setSelectedModel] = useState(null);
      const [activeTab, setActiveTab] = useState('editor'); // 'editor', 'revisions', 'introspect', 'query'
      
      // Editor state
      const [yamlContent, setYamlContent] = useState('');
      const [parsedForm, setParsedForm] = useState(null);
      const [validationResult, setValidationResult] = useState(null);
      const [saving, setSaving] = useState(false);
      const [notification, setNotification] = useState(null);
      
      // Data Source state
      const [savedDataSources, setSavedDataSources] = useState([]);
      const [selectedDataSource, setSelectedDataSource] = useState('default'); // 'default' | '<dsName>' | 'new'
      const [dbTables, setDbTables] = useState([]);
      const [loadingIntrospect, setLoadingIntrospect] = useState(false);
      const [introspectError, setIntrospectError] = useState(null);
      const [selectedTableNames, setSelectedTableNames] = useState([]);
      const [introspectSearch, setIntrospectSearch] = useState('');
      const [customConn, setCustomConn] = useState({
        host: 'postgres',
        port: 5432,
        database: 'cubedb',
        user: 'postgres',
        password: 'postgres',
        schema: 'public',
        ssl: false
      });
      const [customDsName, setCustomDsName] = useState('remote_dwh');
      const [connTestResult, setConnTestResult] = useState(null);
      const [testingConn, setTestingConn] = useState(false);
      const [savingDataSource, setSavingDataSource] = useState(false);
      const [autoJoins, setAutoJoins] = useState(true);
      const [autoMeasures, setAutoMeasures] = useState(true);
      const [generatingBatch, setGeneratingBatch] = useState(false);
      const [expandedTables, setExpandedTables] = useState({});

      // Review Modal & Reporting state
      const [previewModalOpen, setPreviewModalOpen] = useState(false);
      const [previewData, setPreviewData] = useState(null);
      const [loadingPreview, setLoadingPreview] = useState(false);
      const [lastImportReport, setLastImportReport] = useState(null);

      // Query tester state
      const [queryJson, setQueryJson] = useState('{\n  "measures": ["Orders.count", "Orders.total_amount"],\n  "dimensions": ["Orders.status"]\n}');
      const [queryResult, setQueryResult] = useState(null);
      const [queryRunning, setQueryRunning] = useState(false);

      // Git state
      const [gitStatus, setGitStatus] = useState(null);
      const [gitDiff, setGitDiff] = useState('');
      const [gitLog, setGitLog] = useState([]);
      const [gitBranches, setGitBranches] = useState({ current: 'master', branches: ['master'] });
      const [commitMessage, setCommitMessage] = useState('');
      const [pushToRemote, setPushToRemote] = useState(false);
      const [gitLoading, setGitLoading] = useState(false);

      // Security / SSAS RBAC state
      const [securityData, setSecurityData] = useState(null);
      const [securityUsers, setSecurityUsers] = useState([]);
      const [selectedSecurityUser, setSelectedSecurityUser] = useState('admin');
      const [securityUserPassword, setSecurityUserPassword] = useState('admin');
      const [securitySql, setSecuritySql] = useState('SELECT count, total_amount, avg_amount FROM Orders');
      const [securitySqlResult, setSecuritySqlResult] = useState(null);
      const [securityRunning, setSecurityRunning] = useState(false);
      const [showNewUserModal, setShowNewUserModal] = useState(false);
      const [newUserData, setNewUserData] = useState({
        username: '',
        password: '',
        display_name: '',
        role_id: 'sales_rep',
        cityClaim: 'Utrecht',
      });

      // Audit & Concurrency state
      const [auditLogs, setAuditLogs] = useState([]);
      const [auditLoading, setAuditLoading] = useState(false);
      const [auditFilterAction, setAuditFilterAction] = useState('');
      const [auditFilterResult, setAuditFilterResult] = useState('');
      const [conflictWarning, setConflictWarning] = useState(null);
      const [includeDeleted, setIncludeDeleted] = useState(false);
      const [healthData, setHealthData] = useState(null);
      const [metricsData, setMetricsData] = useState(null);
      const [metricsLoading, setMetricsLoading] = useState(false);

      const monacoRef = useRef(null);
      const editorInstance = useRef(null);

      const getHeaders = () => ({
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiSecret}`
      });

      // Show notification toast
      const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      // Load health & schema version
      const fetchHealth = async () => {
        try {
          const res = await fetch('/management/v1/health');
          const data = await res.json();
          setHealthData(data);
          if (data.schemaVersion) setSchemaVersion(data.schemaVersion);
        } catch (e) {
          setHealthData({ status: 'unhealthy', error: e.message });
          setSchemaVersion('Disconnected');
        }
      };

      // Load metrics
      const fetchMetrics = async () => {
        setMetricsLoading(true);
        try {
          const res = await fetch('/management/v1/metrics');
          const data = await res.json();
          setMetricsData(data);
        } catch (e) {
          console.error('Failed to load metrics:', e);
        } finally {
          setMetricsLoading(false);
        }
      };

      // Load models from API
      const fetchModels = async (incDeleted = includeDeleted) => {
        try {
          const url = `/management/v1/models${incDeleted ? '?includeDeleted=true' : ''}`;
          const res = await fetch(url, { headers: getHeaders() });
          if (res.status === 401) {
            notify('Invalid API Secret / Unauthorized', 'error');
            return;
          }
          const data = await res.json();
          setModels(data.models || []);
          if (data.models && data.models.length > 0 && !selectedModel) {
            selectModel(data.models[0].id);
          }
        } catch (e) {
          notify(`Failed to load models: ${e.message}`, 'error');
        }
      };

      // Select and load single model
      const selectModel = async (id) => {
        try {
          const res = await fetch(`/management/v1/models/${id}`, { headers: getHeaders() });
          const data = await res.json();
          if (data.model) {
            setSelectedModel(data.model);
            const content = data.model.active_revision ? data.model.active_revision.content : '';
            setYamlContent(content);
            syncFormFromYaml(content);
            if (editorInstance.current) {
              editorInstance.current.setValue(content);
            }
            validateYaml(content, data.model.file_name);
          }
        } catch (e) {
          notify(`Failed to fetch model: ${e.message}`, 'error');
        }
      };

      // Sync form state when YAML changes
      const syncFormFromYaml = (yamlText) => {
        try {
          const parsed = jsyaml.load(yamlText);
          if (parsed && (parsed.cubes || parsed.views)) {
            setParsedForm(parsed);
          }
        } catch {
          // Keep previous form state if YAML has syntax error
        }
      };

      // Sync YAML text when Form state is edited
      const syncYamlFromForm = (updatedForm) => {
        setParsedForm(updatedForm);
        try {
          const newYaml = jsyaml.dump(updatedForm, { indent: 2, lineWidth: -1 });
          setYamlContent(newYaml);
          if (editorInstance.current && editorInstance.current.getValue() !== newYaml) {
            editorInstance.current.setValue(newYaml);
          }
          validateYaml(newYaml, selectedModel ? selectedModel.file_name : 'model.cube.yml');
        } catch (e) {
          console.error(e);
        }
      };

      // Validate YAML in-memory via Management API
      const validateYaml = async (content, fileName) => {
        try {
          const res = await fetch('/management/v1/models/validate', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ content, fileName: fileName || 'model.cube.yml' })
          });
          const result = await res.json();
          setValidationResult(result);
        } catch (e) {
          setValidationResult({ valid: false, errors: [{ message: e.message }] });
        }
      };

      // Save Model and Hot-Reload with Optimistic Concurrency Control
      const handleSave = async () => {
        if (!selectedModel) return;
        setSaving(true);
        setConflictWarning(null);
        try {
          const res = await fetch(`/management/v1/models/${selectedModel.id}`, {
            method: 'PUT',
            headers: getHeaders(),
            body: JSON.stringify({
              content: yamlContent,
              change_summary: `Updated via Web-UI at ${new Date().toLocaleTimeString()}`,
              expectedRevisionNumber: selectedModel.active_revision ? selectedModel.active_revision.revision_number : undefined,
              source: 'web_ui',
            })
          });
          const data = await res.json();
          if (res.ok) {
            notify('✓ Model opgeslagen & VAS schema atomair geüpdatet!');
            fetchHealth();
            fetchModels();
            selectModel(selectedModel.id);
          } else if (res.status === 409) {
            setConflictWarning(data);
            notify(`⚠️ Versieconflict: ${data.message}`, 'error');
          } else {
            const valDetails = data.validationErrors ? ': ' + data.validationErrors.map(e => e.message).join('; ') : '';
            notify(`Opslaan mislukt: ${data.error || data.message || ''}${valDetails}`, 'error');
          }
        } catch (e) {
          notify(`Netwerkfout: ${e.message}`, 'error');
        } finally {
          setSaving(false);
        }
      };

      // Validated atomic rollback to specific revision
      const handleRollback = async (revNumber) => {
        if (!confirm(`Weet je zeker dat je wilt terugrollen naar revisie #${revNumber}? Deze revisie wordt gevalideerd en als nieuwe actieve revisie gepubliceerd.`)) return;
        try {
          const res = await fetch(`/management/v1/models/${selectedModel.id}/rollback/${revNumber}`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ source: 'web_ui' })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Succesvol teruggerold naar revisie #${revNumber}!`);
            fetchHealth();
            fetchModels();
            selectModel(selectedModel.id);
          } else {
            const valDetails = data.validationErrors ? ': ' + data.validationErrors.map(e => e.message).join('; ') : '';
            notify(`Rollback mislukt: ${data.error || data.message}${valDetails}`, 'error');
          }
        } catch (e) {
          notify(`Fout: ${e.message}`, 'error');
        }
      };

      // Soft-delete model
      const handleDeleteModel = async () => {
        if (!selectedModel) return;
        if (!confirm(`Weet je zeker dat je model '${selectedModel.name}' wilt deactiveren (soft-delete)? Dit model kan later altijd hersteld worden via de audit trail.`)) return;
        try {
          const res = await fetch(`/management/v1/models/${selectedModel.id}`, {
            method: 'DELETE',
            headers: getHeaders(),
            body: JSON.stringify({ actor: 'web_ui', source: 'web_ui' })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Model '${selectedModel.name}' gedeactiveerd.`);
            fetchHealth();
            fetchModels();
            setSelectedModel(null);
          } else {
            notify(`Fout bij verwijderen: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Fout: ${e.message}`, 'error');
        }
      };

      // Restore soft-deleted model
      const handleRestoreModel = async (id, name) => {
        try {
          const res = await fetch(`/management/v1/models/${id}/restore`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ actor: 'web_ui', source: 'web_ui' })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Model '${name || ''}' succesvol hersteld en schema gehercompileerd!`);
            fetchHealth();
            fetchModels();
            selectModel(id);
          } else {
            const valDetails = data.validationErrors ? ': ' + data.validationErrors.map(e => e.message).join('; ') : '';
            notify(`Herstel mislukt: ${data.error || data.message}${valDetails}`, 'error');
          }
        } catch (e) {
          notify(`Fout bij herstel: ${e.message}`, 'error');
        }
      };

      // Cleanup archived revisions per retention policy
      const handleCleanupRevisions = async () => {
        if (!confirm('Revisies opschonen: Verwijder gearchiveerde revisies ouder dan 90 dagen (met behoud van minimaal 5 revisies per model)?')) return;
        try {
          const res = await fetch('/management/v1/models/cleanup-revisions', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ retentionDays: 90, keepMinRevisions: 5, actor: 'web_ui', source: 'web_ui' })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ ${data.deletedCount} oude revisie(s) opgeschoond conform retentiebeleid.`);
            fetchAuditLogs();
            if (selectedModel) selectModel(selectedModel.id);
          } else {
            notify(`Opschonen mislukt: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Fout: ${e.message}`, 'error');
        }
      };

      // Fetch audit logs with filtering
      const fetchAuditLogs = async (actionFilter, resultFilter) => {
        setAuditLoading(true);
        try {
          const act = actionFilter !== undefined ? actionFilter : auditFilterAction;
          const res = resultFilter !== undefined ? resultFilter : auditFilterResult;
          let url = '/management/v1/audit-logs?limit=100';
          if (act) url += `&action=${encodeURIComponent(act)}`;
          if (res) url += `&result=${encodeURIComponent(res)}`;
          const response = await fetch(url, { headers: getHeaders() });
          const data = await response.json();
          if (data && data.auditLogs) {
            setAuditLogs(data.auditLogs);
          }
        } catch (e) {
          console.error('Failed to load audit logs:', e);
        } finally {
          setAuditLoading(false);
        }
      };

      // Fetch registered data sources
      const fetchDataSources = async () => {
        try {
          const res = await fetch('/management/v1/datasources', { headers: getHeaders() });
          if (res.ok) {
            const list = await res.json();
            setSavedDataSources(list || []);
          }
        } catch (e) {
          console.warn('Failed to fetch data sources:', e.message);
        }
      };

      // Test database connection
      const handleTestConnection = async () => {
        setTestingConn(true);
        setConnTestResult(null);
        try {
          const res = await fetch('/management/v1/datasources/test-connection', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(customConn)
          });
          const data = await res.json();
          setConnTestResult(data);
          if (data.success) {
            notify(`✓ Verbinding geslaagd! (${data.latencyMs}ms)`);
            if (data.schemas && data.schemas.length > 0 && !data.schemas.includes(customConn.schema)) {
              setCustomConn(prev => ({ ...prev, schema: data.schemas[0] }));
            }
          } else {
            notify(`Verbinding mislukt: ${data.error}`, 'error');
          }
        } catch (e) {
          setConnTestResult({ success: false, error: e.message });
          notify(`Verbindingsfout: ${e.message}`, 'error');
        } finally {
          setTestingConn(false);
        }
      };

      // Save custom data source permanently
      const handleSaveDataSource = async () => {
        if (!customDsName || !customConn.host || !customConn.database) {
          notify('Vul minimaal Data Source ID, Host en Database in.', 'error');
          return;
        }
        setSavingDataSource(true);
        try {
          const res = await fetch('/management/v1/datasources', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
              name: customDsName,
              db_type: 'postgres',
              host: customConn.host,
              port: customConn.port,
              database_name: customConn.database,
              username: customConn.user,
              password: customConn.password,
              schema_name: customConn.schema,
              ssl: customConn.ssl
            })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Databron '${customDsName}' opgeslagen!`);
            await fetchDataSources();
            setSelectedDataSource(customDsName);
            loadIntrospect(customDsName);
          } else {
            notify(`Opslaan mislukt: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Fout bij opslaan: ${e.message}`, 'error');
        } finally {
          setSavingDataSource(false);
        }
      };

      // Introspect DB (Default, Saved Data Source, or Custom form)
      const loadIntrospect = async (targetDs = selectedDataSource) => {
        setLoadingIntrospect(true);
        setIntrospectError(null);
        try {
          let payload;
          if (targetDs === 'default') {
            payload = { schema: 'public' };
          } else if (targetDs === 'new') {
            payload = { connection: customConn, schema: customConn.schema };
          } else {
            payload = { dataSource: targetDs, schema: customConn.schema || 'public' };
          }

          const res = await fetch('/management/v1/datasources/introspect', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'Fout bij introspectie van tabellen');
          }
          const tables = data.tables || [];
          setDbTables(tables);
          setSelectedTableNames([]); // Bewuste selectie conform plan
          setIntrospectError(null);
        } catch (e) {
          setDbTables([]);
          setSelectedTableNames([]);
          setIntrospectError(e.message);
          notify(`Introspectie mislukt: ${e.message}`, 'error');
        } finally {
          setLoadingIntrospect(false);
        }
      };

      // Open Review Modal vóór definitieve batch import
      const handleOpenReviewModal = async (singleTable = null) => {
        const selected = singleTable ? [singleTable] : dbTables.filter(t => selectedTableNames.includes(`${t.schema}.${t.name}`));
        if (selected.length === 0) {
          notify('Selecteer minstens één tabel om te importeren', 'error');
          return;
        }

        setLoadingPreview(true);
        try {
          const isNew = selectedDataSource === 'new';
          const payload = {
            tables: selected,
            options: { autoJoins, autoMeasures },
            connection: isNew ? customConn : undefined,
            dataSourceName: isNew ? customDsName : (selectedDataSource !== 'default' ? selectedDataSource : undefined),
            dataSource: selectedDataSource !== 'new' && selectedDataSource !== 'default' ? selectedDataSource : undefined,
          };

          const res = await fetch('/management/v1/datasources/preview-import', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            setPreviewData(data);
            setPreviewModalOpen(true);
          } else {
            notify(`Preview mislukt: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Fout bij preview: ${e.message}`, 'error');
        } finally {
          setLoadingPreview(false);
        }
      };

      // Execute atomic batch import after review confirmation
      const handleExecuteBatchImport = async () => {
        if (!previewData || !previewData.items || previewData.items.length === 0) return;
        const targetTables = dbTables.filter(t => previewData.items.some(p => p.table === `${t.schema}.${t.name}`));

        setGeneratingBatch(true);
        try {
          const isNew = selectedDataSource === 'new';
          const payload = {
            tables: targetTables.length > 0 ? targetTables : previewData.items.map(p => ({
              schema: p.table.split('.')[0] || 'public',
              name: p.table.split('.')[1] || p.table,
              columns: [],
              foreignKeys: []
            })),
            options: { autoJoins, autoMeasures },
            connection: isNew ? customConn : undefined,
            dataSourceName: isNew ? customDsName : (selectedDataSource !== 'default' ? selectedDataSource : undefined),
            dataSource: selectedDataSource !== 'new' && selectedDataSource !== 'default' ? selectedDataSource : undefined,
          };

          const res = await fetch('/management/v1/datasources/generate-cubes', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            setPreviewModalOpen(false);
            setLastImportReport(data);
            const dsLabel = data.dataSource !== 'default' ? ` (Data source: ${data.dataSource})` : '';
            notify(`✓ Succesvol ${data.count} modellen atomair geïmporteerd in VAS${dsLabel}!`);
            fetchHealth();
            await fetchModels();
            fetchDataSources();
            if (data.imported && data.imported.length > 0) {
              selectModel(data.imported[0].model.id);
            }
          } else {
            const validationDetails = data.validationErrors ? ': ' + data.validationErrors.map(e => e.message).join('; ') : '';
            notify(`Import mislukt: ${data.error}${validationDetails}`, 'error');
          }
        } catch (e) {
          notify(`Import error: ${e.message}`, 'error');
        } finally {
          setGeneratingBatch(false);
        }
      };

      // Run test query against Cube REST API
      const handleRunQuery = async () => {
        setQueryRunning(true);
        try {
          const parsed = JSON.parse(queryJson);
          const res = await fetch('/cubejs-api/v1/load', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': apiSecret
            },
            body: JSON.stringify({ query: parsed })
          });
          const data = await res.json();
          setQueryResult(data);
        } catch (e) {
          setQueryResult({ error: e.message });
        } finally {
          setQueryRunning(false);
        }
      };

      // Git Integration Functions
      const fetchGitStatus = async () => {
        try {
          const res = await fetch('/management/v1/git/status', { headers: getHeaders() });
          const data = await res.json();
          setGitStatus(data);
        } catch (e) {
          console.warn('Git status error:', e.message);
        }
      };

      const fetchGitDiff = async () => {
        try {
          const res = await fetch('/management/v1/git/diff', { headers: getHeaders() });
          const data = await res.json();
          setGitDiff(data.diff || '');
        } catch (e) {
          console.warn('Git diff error:', e.message);
        }
      };

      const fetchGitLog = async () => {
        try {
          const res = await fetch('/management/v1/git/log', { headers: getHeaders() });
          const data = await res.json();
          setGitLog(data.commits || []);
        } catch (e) {
          console.warn('Git log error:', e.message);
        }
      };

      const fetchGitBranches = async () => {
        try {
          const res = await fetch('/management/v1/git/branches', { headers: getHeaders() });
          const data = await res.json();
          if (data.branches) setGitBranches(data);
        } catch (e) {
          console.warn('Git branches error:', e.message);
        }
      };

      const handleGitCommit = async () => {
        if (!commitMessage.trim()) {
          notify('Please enter a commit message', 'error');
          return;
        }
        setGitLoading(true);
        try {
          const res = await fetch('/management/v1/git/commit', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ message: commitMessage, push: pushToRemote })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Committed to Git (${data.commitHash.slice(0, 7)}) ${data.pushed ? 'and pushed to remote!' : ''}`);
            setCommitMessage('');
            fetchGitStatus();
            fetchGitDiff();
            fetchGitLog();
          } else {
            notify(`Git commit failed: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        } finally {
          setGitLoading(false);
        }
      };

      const handleGitPull = async () => {
        setGitLoading(true);
        try {
          const res = await fetch('/management/v1/git/pull', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({})
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Pulled from Git! Synced ${data.importedCount || 0} models into PostgreSQL.`);
            fetchHealth();
            fetchModels();
            fetchGitStatus();
            fetchGitLog();
          } else {
            notify(`Git pull failed: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        } finally {
          setGitLoading(false);
        }
      };

      const handleGitCheckout = async (branch, createNew = false) => {
        setGitLoading(true);
        try {
          const res = await fetch('/management/v1/git/checkout', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ branch, createNew })
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Switched to branch "${branch}" and synced models!`);
            fetchHealth();
            fetchModels();
            fetchGitStatus();
            fetchGitBranches();
          } else {
            notify(`Checkout failed: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Error: ${e.message}`, 'error');
        } finally {
          setGitLoading(false);
        }
      };

      // Default password helper for test accounts
      const getDefaultPasswordForUser = (uname) => {
        if (uname === 'admin') return 'admin';
        if (uname === 'sales_amsterdam') return 'amsterdam123';
        if (uname === 'sales_rotterdam') return 'rotterdam123';
        return '';
      };

      // Security / SSAS RBAC API helpers
      const fetchSecurityRoles = async () => {
        try {
          const [rolesRes, usersRes] = await Promise.all([
            fetch('/management/v1/security/roles', { headers: getHeaders() }),
            fetch('/management/v1/security/users', { headers: getHeaders() })
          ]);
          const rolesData = await rolesRes.json();
          const usersData = await usersRes.json();
          setSecurityData(rolesData);
          if (usersData && usersData.users) {
            setSecurityUsers(usersData.users);
            if (!selectedSecurityUser && usersData.users.length > 0) {
              const u0 = usersData.users[0].username;
              setSelectedSecurityUser(u0);
              setSecurityUserPassword(getDefaultPasswordForUser(u0));
            }
          }
        } catch (e) {
          console.error('Failed to load security roles or users:', e);
        }
      };

      const onSelectSecurityUser = (uname) => {
        setSelectedSecurityUser(uname);
        const defPass = getDefaultPasswordForUser(uname);
        if (defPass) {
          setSecurityUserPassword(defPass);
        }
      };

      const handleCreateUser = async () => {
        if (!newUserData.username || !newUserData.display_name || !newUserData.password) {
          notify('Vul gebruikersnaam, naam en wachtwoord in.', 'error');
          return;
        }
        try {
          const payload = {
            username: newUserData.username.trim(),
            password: newUserData.password,
            display_name: newUserData.display_name.trim(),
            role_id: newUserData.role_id,
            claims: newUserData.cityClaim ? { city: newUserData.cityClaim.trim() } : {},
          };
          const res = await fetch('/management/v1/security/users', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            notify(`✓ Gebruiker '${data.user.username}' succesvol opgeslagen!`);
            setShowNewUserModal(false);
            setNewUserData({ username: '', password: '', display_name: '', role_id: 'sales_rep', cityClaim: '' });
            await fetchSecurityRoles();
            onSelectSecurityUser(data.user.username);
            setSecurityUserPassword(payload.password);
          } else {
            notify(`Fout bij aanmaken gebruiker: ${data.error}`, 'error');
          }
        } catch (e) {
          notify(`Fout: ${e.message}`, 'error');
        }
      };

      const handleRunSecuritySql = async (overrideSql, overrideUser, overridePass) => {
        const queryToRun = overrideSql || securitySql;
        const userToRun = overrideUser || selectedSecurityUser;
        const passToRun = overridePass !== undefined ? overridePass : securityUserPassword;

        setSecurityRunning(true);
        setSecuritySqlResult(null);
        try {
          const res = await fetch('/management/v1/security/test-sql', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
              username: userToRun,
              password: passToRun,
              sql: queryToRun
            })
          });
          const data = await res.json();
          setSecuritySqlResult(data);
        } catch (err) {
          setSecuritySqlResult({ success: false, error: err.message });
        } finally {
          setSecurityRunning(false);
        }
      };

      // Initialize Monaco Editor
      useEffect(() => {
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
          if (monacoRef.current && !editorInstance.current) {
            editorInstance.current = monaco.editor.create(monacoRef.current, {
              value: yamlContent || '# Select or create a model to view definition',
              language: 'yaml',
              theme: 'vs-dark',
              automaticLayout: true,
              minimap: { enabled: false },
              fontSize: 13,
              tabSize: 2,
              scrollBeyondLastLine: false,
            });

            editorInstance.current.onDidChangeModelContent(() => {
              const val = editorInstance.current.getValue();
              setYamlContent(val);
              syncFormFromYaml(val);
              validateYaml(val, selectedModel ? selectedModel.file_name : 'model.cube.yml');
            });
          }
        });
      }, []);

      // Initial data fetch
      useEffect(() => {
        fetchHealth();
        fetchModels();
        fetchDataSources();
        loadIntrospect('default');
        fetchGitStatus();
        fetchGitBranches();
        fetchGitLog();
        fetchGitDiff();
        fetchSecurityRoles();
      }, [apiSecret]);

      // Helper to update field in current form
      const updateCubeProp = (cubeIdx, key, val) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx][key] = val;
        syncYamlFromForm(copy);
      };

      const addDimension = (cubeIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        if (!copy.cubes[cubeIdx].dimensions) copy.cubes[cubeIdx].dimensions = [];
        copy.cubes[cubeIdx].dimensions.push({
          name: `new_dim_${Date.now() % 1000}`,
          sql: 'column_name',
          type: 'string'
        });
        syncYamlFromForm(copy);
      };

      const removeDimension = (cubeIdx, dimIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx].dimensions.splice(dimIdx, 1);
        syncYamlFromForm(copy);
      };

      const addMeasure = (cubeIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        if (!copy.cubes[cubeIdx].measures) copy.cubes[cubeIdx].measures = [];
        copy.cubes[cubeIdx].measures.push({
          name: `new_measure_${Date.now() % 1000}`,
          type: 'count'
        });
        syncYamlFromForm(copy);
      };

      const removeMeasure = (cubeIdx, mIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx].measures.splice(mIdx, 1);
        syncYamlFromForm(copy);
      };

      const addJoin = (cubeIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        if (!copy.cubes[cubeIdx].joins) copy.cubes[cubeIdx].joins = [];
        copy.cubes[cubeIdx].joins.push({
          name: 'TargetCube',
          sql: '{CUBE}.foreign_key = {TargetCube.id}',
          relationship: 'many_to_one'
        });
        syncYamlFromForm(copy);
      };

      const removeJoin = (cubeIdx, jIdx) => {
        const copy = JSON.parse(JSON.stringify(parsedForm));
        copy.cubes[cubeIdx].joins.splice(jIdx, 1);
        syncYamlFromForm(copy);
      };

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden">
          {/* Top Navigation */}
          <header className="h-14 border-b border-slate-800 bg-slate-900 px-4 flex items-center justify-between shrink-0">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center font-black text-white text-[11px] shadow-md tracking-wider">
                VAS
              </div>
              <div className="flex items-center space-x-2">
                <span className="font-extrabold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-300">
                  VAS
                </span>
                <span className="text-xs px-2.5 py-0.5 rounded bg-indigo-950/80 text-indigo-300 border border-indigo-800/80 font-medium">
                  Voxel Analytics Service
                </span>
              </div>
            </div>

            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2 text-xs bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-slate-400">Schema Version:</span>
                <span className="font-mono text-emerald-300 font-semibold">{schemaVersion}</span>
              </div>

              {gitStatus && (
                <button 
                  onClick={() => { setActiveTab('git'); fetchGitStatus(); fetchGitDiff(); }}
                  className="flex items-center space-x-1.5 text-xs bg-slate-800/80 hover:bg-slate-700 px-2.5 py-1.5 rounded-full border border-slate-700 transition-colors"
                  title="Git Version Control"
                >
                  <span className="text-amber-400">🌿</span>
                  <span className="font-mono text-slate-200 font-semibold">{gitStatus.branch || 'master'}</span>
                  {!gitStatus.isClean ? (
                    <span className="text-[10px] bg-amber-950 text-amber-300 border border-amber-800 px-1 rounded-full font-mono">modified</span>
                  ) : (
                    <span className="text-[10px] text-emerald-400 font-mono">clean</span>
                  )}
                </button>
              )}

              <div className="flex items-center space-x-2 text-xs text-slate-400 bg-slate-800/50 px-2 py-1 rounded border border-slate-700/50">
                <span>SQL-API:</span>
                <span className="font-mono text-indigo-300 font-bold">15432</span>
              </div>

              <div className="flex items-center space-x-2">
                <input 
                  type="password"
                  placeholder="API Secret"
                  value={apiSecret}
                  onChange={(e) => {
                    setApiSecret(e.target.value);
                    localStorage.setItem('cube_mgmt_secret', e.target.value);
                  }}
                  className="bg-slate-950 border border-slate-700 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 w-28"
                  title="CUBEJS_API_SECRET for Management API auth"
                />
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className={`fixed bottom-4 right-4 z-50 px-4 py-2.5 rounded-lg shadow-xl text-sm font-medium flex items-center space-x-2 border ${
              notification.type === 'error' ? 'bg-rose-950 border-rose-700 text-rose-200' : 'bg-emerald-950 border-emerald-700 text-emerald-200'
            }`}>
              <span>{notification.msg}</span>
            </div>
          )}

          {/* Main Layout Area */}
          <div className="flex flex-1 overflow-hidden">
            {/* Sidebar: Schema Explorer */}
            <aside className="w-72 border-r border-slate-800 bg-slate-900/60 flex flex-col shrink-0">
              <div className="p-3 border-b border-slate-800 flex items-center justify-between">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Semantic Explorer</span>
                <button
                  onClick={() => {
                    const name = prompt('Enter new Cube name (e.g. Products):');
                    if (!name) return;
                    const initialYaml = `cubes:\n  - name: ${name}\n    sql_table: public.${name.toLowerCase()}\n    dimensions:\n      - name: id\n        sql: id\n        type: number\n        primary_key: true\n    measures:\n      - name: count\n        type: count\n`;
                    fetch('/management/v1/models', {
                      method: 'POST',
                      headers: getHeaders(),
                      body: JSON.stringify({ name, content: initialYaml })
                    }).then(r => r.json()).then(d => {
                      if (d.model) {
                        notify(`Created ${name}`);
                        fetchModels();
                        selectModel(d.model.id);
                      }
                    });
                  }}
                  className="text-xs px-2 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded font-medium flex items-center space-x-1"
                >
                  <span>+ New</span>
                </button>
              </div>

              {/* Models List */}
              <div className="flex-1 overflow-y-auto p-2 space-y-1">
                <div className="flex items-center justify-between px-2 pt-1 pb-1">
                  <span className="text-[11px] font-semibold text-slate-500 uppercase">Cubes & Views</span>
                  <label className="flex items-center space-x-1 text-[10px] text-slate-500 cursor-pointer" title="Toon ook gedeactiveerde (soft-deleted) modellen">
                    <input
                      type="checkbox"
                      checked={includeDeleted}
                      onChange={(e) => {
                        setIncludeDeleted(e.target.checked);
                        fetchModels(e.target.checked);
                      }}
                      className="rounded bg-slate-950 border-slate-700 text-indigo-600 w-3 h-3"
                    />
                    <span>Prullenbak</span>
                  </label>
                </div>
                {models.map(m => (
                  <button
                    key={m.id}
                    onClick={() => selectModel(m.id)}
                    className={`w-full text-left px-2.5 py-2 rounded-md text-sm flex items-center justify-between transition-colors ${
                      selectedModel && selectedModel.id === m.id
                        ? 'bg-indigo-900/40 text-indigo-200 border border-indigo-700/50'
                        : 'text-slate-300 hover:bg-slate-800/60'
                    } ${m.is_active === false ? 'opacity-50 line-through' : ''}`}
                  >
                    <div className="flex items-center space-x-2 truncate">
                      <span className={`w-2 h-2 rounded-full ${m.is_active === false ? 'bg-rose-500' : m.model_type === 'view' ? 'bg-purple-400' : 'bg-indigo-400'}`}></span>
                      <span className="font-medium truncate">{m.name}</span>
                    </div>
                    <span className="text-[10px] text-slate-500 font-mono">
                      {m.is_active === false ? '(verwijderd)' : `r${m.active_revision ? m.active_revision.revision_number : 1}`}
                    </span>
                  </button>
                ))}

                {models.length === 0 && (
                  <div className="text-xs text-slate-500 p-3 italic text-center">
                    No models in PostgreSQL. Click "+ New" or generate from introspected tables.
                  </div>
                )}

                {/* Data Source Tables */}
                <div className="pt-4 text-[11px] font-semibold text-slate-500 uppercase px-2 pb-1 flex items-center justify-between">
                  <span>Source Tables</span>
                  <button onClick={loadIntrospect} className="text-indigo-400 hover:underline">
                    {loadingIntrospect ? '...' : 'Refresh'}
                  </button>
                </div>
                {dbTables.map(t => (
                  <div key={`${t.schema}.${t.name}`} className="group px-2.5 py-1.5 rounded text-xs flex items-center justify-between text-slate-400 hover:bg-slate-800/40">
                    <span className="truncate font-mono">{t.name}</span>
                    <button
                      onClick={() => generateCubeFromTable(t)}
                      className="opacity-0 group-hover:opacity-100 text-[10px] px-1.5 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800 hover:bg-indigo-800"
                      title="Generate Cube from table"
                    >
                      + Cube
                    </button>
                  </div>
                ))}
              </div>
            </aside>

            {/* Content Area */}
            <main className="flex-1 flex flex-col overflow-hidden bg-slate-950">
              {/* Tab Navigation & Action Bar */}
              <div className="h-11 border-b border-slate-800 bg-slate-900/40 px-4 flex items-center justify-between shrink-0">
                <div className="flex space-x-1">
                  {[
                    { id: 'editor', label: '📐 Model Editor & YAML' },
                    { id: 'introspect', label: '🔌 Data Sources & Tabellen' },
                    { id: 'security', label: '🔐 Toegangsbeheer & Rollen' },
                    { id: 'git', label: '🌿 Git Versiebeheer' },
                    { id: 'revisions', label: '⏱️ Revisies & Herstel' },
                    { id: 'audit', label: '📜 Audit Trail & Logs' },
                    { id: 'metrics', label: '📊 Metrics & Health' },
                    { id: 'query', label: '⚡ SQL & BI Query Tester' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => {
                        setActiveTab(tab.id);
                        if (tab.id === 'audit') fetchAuditLogs();
                        if (tab.id === 'metrics') { fetchMetrics(); fetchHealth(); }
                      }}
                      className={`px-3 py-1.5 rounded-t text-xs font-medium transition-colors ${
                        activeTab === tab.id
                          ? 'bg-slate-800 text-indigo-300 border-b-2 border-indigo-500'
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {activeTab === 'editor' && (
                  <div className="flex items-center space-x-3">
                    {/* Validation Pill */}
                    {validationResult && (
                      <div className={`text-xs px-2.5 py-1 rounded-full flex items-center space-x-1.5 font-medium ${
                        validationResult.valid
                          ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800/80'
                          : 'bg-rose-950/80 text-rose-300 border border-rose-800/80'
                      }`}>
                        <span className={`w-1.5 h-1.5 rounded-full ${validationResult.valid ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                        <span>{validationResult.valid ? '✓ Valid Schema' : `${validationResult.errors?.length || 1} Error(s)`}</span>
                      </div>
                    )}

                    <button
                      onClick={() => validateYaml(yamlContent, selectedModel ? selectedModel.file_name : 'model.cube.yml')}
                      className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium"
                    >
                      Validate
                    </button>

                    {selectedModel && selectedModel.is_active !== false && (
                      <button
                        onClick={handleDeleteModel}
                        className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-rose-950 hover:text-rose-300 text-slate-400 font-medium transition-colors"
                        title="Deactiveer model (soft-delete)"
                      >
                        🗑️ Deactiveren
                      </button>
                    )}

                    {selectedModel && selectedModel.is_active === false && (
                      <button
                        onClick={() => handleRestoreModel(selectedModel.id, selectedModel.name)}
                        className="text-xs px-3 py-1 rounded bg-emerald-700 hover:bg-emerald-600 text-white font-medium shadow"
                        title="Herstel gedeactiveerd model"
                      >
                        ♻️ Herstel Model
                      </button>
                    )}

                    <button
                      onClick={handleSave}
                      disabled={saving || (validationResult && !validationResult.valid) || (selectedModel && selectedModel.is_active === false)}
                      className={`text-xs px-3.5 py-1 rounded font-semibold text-white shadow flex items-center space-x-1.5 ${
                        saving || (validationResult && !validationResult.valid) || (selectedModel && selectedModel.is_active === false)
                          ? 'bg-slate-700 cursor-not-allowed opacity-60'
                          : 'bg-indigo-600 hover:bg-indigo-500'
                      }`}
                    >
                      <span>{saving ? 'Hot-Reloading...' : 'Save & Hot-Reload'}</span>
                    </button>
                  </div>
                )}
              </div>

              {/* TAB 1: VISUAL & YAML SPLIT-VIEW */}
              {activeTab === 'editor' && (
                <div className="flex-1 flex flex-col overflow-hidden">
                  {/* Conflict Warning Banner if optimistic concurrency detects a mismatch */}
                  {conflictWarning && (
                    <div className="bg-amber-950/80 border-b border-amber-600/80 text-amber-200 p-3 text-xs flex items-center justify-between shrink-0 shadow-lg">
                      <div className="flex items-center space-x-2.5">
                        <span className="text-base">⚠️</span>
                        <div>
                          <strong>Versieconflict gedetecteerd:</strong> Dit model is tussentijds gewijzigd (huidige actieve revisie is #{conflictWarning.currentRevision}{conflictWarning.currentUpdatedBy ? ` door ${conflictWarning.currentUpdatedBy}` : ''}). Jouw lokale wijzigingen zijn bewaard in de editor en niet verloren gegaan.
                        </div>
                      </div>
                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => {
                            setConflictWarning(null);
                            selectModel(selectedModel.id);
                          }}
                          className="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded font-semibold text-xs shadow"
                        >
                          Laad Nieuwste Revisie
                        </button>
                        <button
                          onClick={() => setConflictWarning(null)}
                          className="px-2 py-1 text-slate-400 hover:text-slate-200 text-xs"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  )}

                  <div className="flex-1 flex overflow-hidden">
                  {/* Left Half: Visual Form Builder */}
                  <div className="w-1/2 border-r border-slate-800 overflow-y-auto p-4 space-y-6">
                    {parsedForm && parsedForm.cubes && parsedForm.cubes.map((cube, cIdx) => (
                      <div key={cube.name || cIdx} className="space-y-5 bg-slate-900/50 p-4 rounded-xl border border-slate-800/80">
                        {/* Cube Header */}
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-sm font-bold text-slate-200 flex items-center space-x-2">
                              <span className="w-2.5 h-2.5 rounded bg-indigo-500"></span>
                              <span>Cube: {cube.name}</span>
                            </span>
                            <span className="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">
                              sql_table: {cube.sql_table || 'custom'}
                            </span>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-[11px] font-medium text-slate-400">Cube Name</label>
                              <input
                                type="text"
                                value={cube.name || ''}
                                onChange={(e) => updateCubeProp(cIdx, 'name', e.target.value)}
                                className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 mt-1 focus:border-indigo-500 focus:outline-none"
                              />
                            </div>
                            <div>
                              <label className="text-[11px] font-medium text-slate-400">SQL Table</label>
                              <input
                                type="text"
                                value={cube.sql_table || ''}
                                onChange={(e) => updateCubeProp(cIdx, 'sql_table', e.target.value)}
                                className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 mt-1 focus:border-indigo-500 focus:outline-none font-mono"
                              />
                            </div>
                          </div>
                        </div>

                        {/* Dimensions Builder */}
                        <div className="border-t border-slate-800 pt-4">
                          <div className="flex items-center justify-between mb-2">
                            <span className="text-xs font-semibold uppercase tracking-wider text-indigo-300">Dimensions</span>
                            <button
                              onClick={() => addDimension(cIdx)}
                              className="text-[11px] text-indigo-400 hover:text-indigo-300 font-medium"
                            >
                              + Add Dimension
                            </button>
                          </div>

                  <div className="space-y-3">
                    {dbTables
                      .filter(t => !introspectSearch || t.name.toLowerCase().includes(introspectSearch.toLowerCase()))
                      .map(table => {
                        const tableKey = `${table.schema}.${table.name}`;
                        const isSelected = selectedTableNames.includes(tableKey);
                        const isExpanded = !!expandedTables[tableKey];
                        const cubeName = table.name.replace(/^(sample_|tbl_|dim_|fact_)/i, '')
                          .split(/[_-]+/).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
                        const alreadyExists = models.some(m => m.name.toLowerCase() === cubeName.toLowerCase());
                        const pkCols = table.columns.filter(c => c.isPrimaryKey).map(c => c.name);
                        const fks = table.foreignKeys || [];

                        return (
                          <div
                            key={tableKey}
                            className={`bg-slate-900 border rounded-xl overflow-hidden transition-all ${
                              isSelected ? 'border-indigo-600/70 bg-indigo-950/10' : 'border-slate-800'
                            }`}
                          >
                            {/* Card Header Row */}
                            <div className="p-4 flex items-center justify-between">
                              <div className="flex items-center space-x-3">
                                <input
                                  type="checkbox"
                                  checked={isSelected}
                                  onChange={(e) => {
                                    if (e.target.checked) {
                                      setSelectedTableNames([...selectedTableNames, tableKey]);
                                    } else {
                                      setSelectedTableNames(selectedTableNames.filter(k => k !== tableKey));
                                    }
                                  }}
                                  className="w-4 h-4 rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer"
                                />
                                <div>
                                  <div className="flex items-center space-x-2">
                                    <span className="font-mono font-bold text-slate-100 text-sm">{table.schema}.{table.name}</span>
                                    {alreadyExists ? (
                                      <span className="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded-full font-mono font-semibold">
                                        ✓ in VAS ({cubeName})
                                      </span>
                                    ) : (
                                      <span className="text-[10px] bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded-full font-mono font-semibold">
                                        + Nieuwe Tabel
                                      </span>
                                    )}
                                  </div>
                                  <div className="flex items-center space-x-2 text-[11px] text-slate-400 mt-1">
                                    <span>{table.columns.length} kolommen</span>
                                    {pkCols.length > 0 && (
                                      <>
                                        <span>•</span>
                                        <span className="text-amber-400 font-mono">🔑 PK: {pkCols.join(', ')}</span>
                                      </>
                                    )}
                                    {fks.length > 0 && (
                                      <>
                                        <span>•</span>
                                        <span className="text-indigo-400 font-mono">🔗 {fks.length} Foreign Key(s)</span>
                                      </>
                                    )}
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center space-x-2">
                                <button
                                  onClick={() => setExpandedTables({ ...expandedTables, [tableKey]: !isExpanded })}
                                  className="text-xs px-2.5 py-1 text-slate-400 hover:text-slate-200 bg-slate-950 rounded border border-slate-800"
                                >
                                  {isExpanded ? 'Verberg Kolommen ▲' : 'Bekijk Kolommen ▼'}
                                </button>
                                <button
                                  onClick={() => handleOpenReviewModal(table)}
                                  className="text-xs px-3 py-1 bg-indigo-950 hover:bg-indigo-900 text-indigo-300 border border-indigo-700/60 rounded font-medium transition-colors"
                                >
                                  {alreadyExists ? 'Review & Update' : '+ Review & Import'}
                                </button>
                              </div>
                            </div>

                            {/* Expandable Columns & Foreign Keys Details */}
                            {isExpanded && (
                              <div className="border-t border-slate-800/80 bg-slate-950/70 p-4 space-y-3">
                                {fks.length > 0 && (
                                  <div>
                                    <span className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold block mb-1">
                                      Gedetecteerde Relaties (Foreign Keys):
                                    </span>
                                    <div className="space-y-1">
                                      {fks.map((fk, fkIdx) => (
                                        <div key={fkIdx} className="text-xs font-mono text-indigo-300 bg-indigo-950/40 border border-indigo-900/40 p-1.5 rounded flex items-center space-x-2">
                                          <span>🔗</span>
                                          <span><strong>{table.name}.{fk.column}</strong> ➔ <strong>{fk.foreignTable}.{fk.foreignColumn}</strong> (Many-to-One relatie)</span>
                                        </div>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                <div>
                                  <span className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold block mb-1">
                                    Kolommen & Datatypes:
                                  </span>
                                  <div className="grid grid-cols-3 gap-2">
                                    {table.columns.map(col => (
                                      <div key={col.name} className="bg-slate-900/90 border border-slate-800/80 p-2 rounded text-xs flex items-center justify-between font-mono">
                                        <div className="truncate">
                                          <span className="text-slate-200">{col.name}</span>
                                          {col.isPrimaryKey && <span className="text-amber-400 ml-1">🔑</span>}
                                        </div>
                                        <span className="text-slate-500 text-[10px]">{col.type}</span>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}

                    {dbTables.length === 0 && !loadingIntrospect && !introspectError && (
                      <div className="p-8 text-center text-slate-500 text-xs italic bg-slate-900 rounded-xl border border-slate-800">
                        Geen tabellen gevonden in het huidige schema. Klik op "Haal Tabellen Op" of kies een andere databron.
                      </div>
                    )}
                  </div>

                  {/* PRE-IMPORT REVIEW & CONFLICTS MODAL */}
                  {previewModalOpen && previewData && (
                    <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in">
                        {/* Modal Header */}
                        <div className="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
                          <div className="flex items-center space-x-3">
                            <span className="text-2xl">📋</span>
                            <div>
                              <h3 className="text-base font-bold text-slate-100">Review & Conflicten: Model Import in VAS</h3>
                              <p className="text-xs text-slate-400">
                                Controleer de gegenereerde cubes, joins en eventuele overschrijvingen vóórdat de atomaire transactie wordt gepubliceerd.
                              </p>
                            </div>
                          </div>
                          <button
                            onClick={() => setPreviewModalOpen(false)}
                            className="text-slate-400 hover:text-slate-200 text-lg p-1"
                          >
                            ✕
                          </button>
                        </div>

                        {/* Modal Body / Summary Badges */}
                        <div className="p-5 overflow-y-auto space-y-4 flex-1">
                          {/* Summary Badges Grid */}
                          <div className="grid grid-cols-4 gap-3">
                            <div className="bg-slate-950 border border-slate-800 p-3 rounded-lg text-center">
                              <span className="text-[11px] text-slate-400 block">Totaal Geselecteerd</span>
                              <span className="text-lg font-bold text-slate-200">{previewData.summary.total}</span>
                            </div>
                            <div className="bg-emerald-950/30 border border-emerald-800/60 p-3 rounded-lg text-center">
                              <span className="text-[11px] text-emerald-400 block">Nieuwe Cubes</span>
                              <span className="text-lg font-bold text-emerald-300">+{previewData.summary.toCreate}</span>
                            </div>
                            <div className={`p-3 rounded-lg text-center border ${
                              previewData.summary.toUpdate > 0 
                                ? 'bg-amber-950/40 border-amber-800 text-amber-200' 
                                : 'bg-slate-950 border-slate-800 text-slate-400'
                            }`}>
                              <span className="text-[11px] block">Overschrijven (Conflict)</span>
                              <span className="text-lg font-bold">{previewData.summary.toUpdate}</span>
                            </div>
                            <div className={`p-3 rounded-lg text-center border ${
                              previewData.summary.totalSkippedJoins > 0 
                                ? 'bg-sky-950/40 border-sky-800 text-sky-200' 
                                : 'bg-slate-950 border-slate-800 text-slate-400'
                            }`}>
                              <span className="text-[11px] block">Veilig Overgeslagen Joins</span>
                              <span className="text-lg font-bold">{previewData.summary.totalSkippedJoins}</span>
                            </div>
                          </div>

                          {/* Compiler Validation Banner */}
                          <div className={`p-3 rounded-lg border text-xs flex items-center justify-between ${
                            previewData.valid 
                              ? 'bg-emerald-950/30 border-emerald-800 text-emerald-300' 
                              : 'bg-rose-950/40 border-rose-800 text-rose-300'
                          }`}>
                            <div className="flex items-center space-x-2">
                              <span>{previewData.valid ? '✓' : '⚠️'}</span>
                              <span>
                                {previewData.valid 
                                  ? 'Virtuele schemacompilatie (@cubejs-backend/schema-compiler) succesvol doorstaan!' 
                                  : `Compilatiewaarschuwing: ${previewData.validationErrors.map(e => e.message).join('; ')}`}
                              </span>
                            </div>
                            <span className="font-mono text-[11px] text-slate-400">Atomaire Transactie Gereed</span>
                          </div>

                          {/* Items List */}
                          <div className="space-y-2">
                            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 block">
                              Te importeren modellen ({previewData.items.length}):
                            </span>
                            <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                              {previewData.items.map((item, idx) => (
                                <div
                                  key={idx}
                                  className="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-xs font-mono"
                                >
                                  <div>
                                    <div className="flex items-center space-x-2">
                                      <span className="font-bold text-slate-100">{item.cubeName}</span>
                                      <span className="text-slate-500 font-sans">({item.table})</span>
                                      {item.isConflict ? (
                                        <span className="text-[10px] bg-amber-950/80 text-amber-300 border border-amber-700 px-2 py-0.5 rounded font-sans font-semibold">
                                          ⚠️ Overschrijft bestaand model
                                        </span>
                                      ) : (
                                        <span className="text-[10px] bg-emerald-950/80 text-emerald-300 border border-emerald-700 px-2 py-0.5 rounded font-sans font-semibold">
                                          + Nieuw model
                                        </span>
                                      )}
                                      {item.dataSource !== 'default' && (
                                        <span className="text-[10px] bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded font-sans">
                                          DB: {item.dataSource}
                                        </span>
                                      )}
                                    </div>
                                    <div className="text-[11px] text-slate-400 font-sans mt-1 flex items-center space-x-3">
                                      <span>{item.dimensionsCount} dimensies</span>
                                      <span>•</span>
                                      <span>{item.measuresCount} measures</span>
                                      <span>•</span>
                                      <span className="text-indigo-400">{item.joinsCount} join(s) gelegd</span>
                                    </div>
                                    {item.skippedJoins && item.skippedJoins.length > 0 && (
                                      <div className="mt-1.5 text-[11px] text-amber-400/90 font-sans bg-amber-950/20 border border-amber-900/30 p-1.5 rounded">
                                        ⚠️ {item.skippedJoins.join('; ')}
                                      </div>
                                    )}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>

                        {/* Modal Footer */}
                        <div className="p-4 border-t border-slate-800 bg-slate-950 flex items-center justify-between">
                          <button
                            onClick={() => setPreviewModalOpen(false)}
                            className="text-xs px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium"
                          >
                            Annuleren
                          </button>

                          <button
                            onClick={handleExecuteBatchImport}
                            disabled={generatingBatch || !previewData.valid}
                            className="text-xs px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow disabled:opacity-50 flex items-center space-x-2"
                          >
                            <span>🚀</span>
                            <span>
                              {generatingBatch 
                                ? 'Transactie wordt uitgevoerd...' 
                                : `Bevestig & Importeer Atomaire Batch (${previewData.summary.total} modellen)`}
                            </span>
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
