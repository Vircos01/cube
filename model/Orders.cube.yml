cubes:
  - name: Orders
    sql_table: public.sample_orders
    
    joins:
      - name: Users
        sql: "{CUBE}.user_id = {Users.id}"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: status
        sql: status
        type: string

      - name: created_at
        sql: created_at
        type: time

    measures:
      - name: count
        type: count

      - name: total_amount
        sql: amount
        type: sum

      - name: avg_order_value
        sql: amount
        type: avg
